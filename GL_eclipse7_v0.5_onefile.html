<script>
// ===== js/utils.js =====
// ============================================================
// utils.js — 수학/공용 도구
// ============================================================
GL.U = {
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  angleTo: (a, b) => Math.atan2(b.y - a.y, b.x - a.x),
  angDiff(a, b) {
    let d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  },
  rand: (a, b) => a + Math.random() * (b - a),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  deg: (d) => d * Math.PI / 180,

  // 부채꼴 판정: 중심 c, 방향 dir, 반경 r, 각도 arc(라디안), 대상 t(반지름 t.r)
  inArc(c, dir, r, arc, t) {
    const d = Math.hypot(t.x - c.x, t.y - c.y);
    if (d > r + (t.r || 0)) return false;
    if (arc >= Math.PI * 2 - 0.01) return true;
    const a = Math.atan2(t.y - c.y, t.x - c.x);
    return Math.abs(GL.U.angDiff(dir, a)) <= arc / 2 + Math.atan2(t.r || 0, Math.max(d, 1));
  },
  // 직선(폭 w) 판정
  inLine(c, dir, len, w, t) {
    const dx = t.x - c.x, dy = t.y - c.y;
    const fx = Math.cos(dir), fy = Math.sin(dir);
    const along = dx * fx + dy * fy;
    const side = Math.abs(-dx * fy + dy * fx);
    return along >= -(t.r || 0) && along <= len + (t.r || 0) && side <= w / 2 + (t.r || 0);
  },
  inCircle(c, r, t) {
    return Math.hypot(t.x - c.x, t.y - c.y) <= r + (t.r || 0);
  },
};

</script>
<script>
// ===== js/input.js =====
// ============================================================
// input.js — 공통 조작 체계 + 0.5초 홀딩 판정 (키보드·마우스)
// 키 입력을 '행동 이벤트'로 바꿔 GL.Input.events 에 쌓는다.
// ============================================================
GL.Input = {
  keys: {},            // 눌려 있는 키 (e.code)
  events: [],          // 이번 프레임에 발생한 행동
  mouse: { x: 0, y: 0, dx: 0, dy: 0, left: false, right: false },
  locked: false,       // 포인터 잠금(마우스로 카메라 회전)
  _left: null,         // { t, heavyFired, air }
  _num: {},            // 숫자키 홀딩 상태 { Digit1: { t, fired } }
  isAirborne: () => false, // main 에서 연결

  init(canvas) {
    const prevent = ['Tab', 'Space', 'ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight', 'Escape'];
    window.addEventListener('keydown', (e) => {
      if (prevent.includes(e.code) || e.code.startsWith('Digit')) e.preventDefault();
      if (e.repeat) return;
      this.keys[e.code] = true;
      this.onKeyDown(e.code);
    });
    window.addEventListener('keyup', (e) => {
      this.keys[e.code] = false;
      this.onKeyUp(e.code);
    });
    window.addEventListener('blur', () => { this.keys = {}; this._left = null; this._num = {}; this.mouse.right = false; });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('mousemove', (e) => {
      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
      // 마우스 이동 = 카메라 회전 (잠금 중일 때, 또는 잠금이 막힌 환경에선 마우스 이동량 그대로)
      if (GL.Main.state === 'play') { this.mouse.dx += e.movementX || 0; this.mouse.dy += e.movementY || 0; }
    });
    document.addEventListener('pointerlockchange', () => {
      this.locked = document.pointerLockElement === canvas;
      if (!this.locked && GL.Main.state === 'play') GL.Main.state = 'pause';   // Esc로 잠금이 풀리면 일시정지
    });
    this.canvas = canvas;
    canvas.addEventListener('mousedown', (e) => {
      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
      if (GL.Touch && GL.Touch.enabled) return;   // 휴대폰은 touch.js 가 처리
      if (!this.locked && GL.Main.state === 'play') this.lock();
      if (e.button === 0) {
        this.push('click');
        this.leftDown(this.keys.ControlLeft || this.keys.ControlRight || e.ctrlKey);
      } else if (e.button === 2) {
        this.mouse.right = true; // 우클릭 = 대쉬(누르고 있는 동안)
      }
    });
    window.addEventListener('mouseup', (e) => {
      if (GL.Touch && GL.Touch.enabled) return;
      if (e.button === 0) {
        this.leftUp();
      } else if (e.button === 2) {
        this.mouse.right = false;
      }
    });
  },

  // 공격 버튼 누름/뗌 (마우스 좌클릭, 휴대폰 공격 버튼 공용)
  leftDown(ctrl) {
    this.mouse.left = true;
    if (this.isAirborne()) {
      // 공중 : 좌클릭 = 점프 공격, Ctrl + 좌클릭 = 점프 강공격
      this.push(ctrl ? 'jumpHeavy' : 'jumpAtk');
      this._left = { t: 0, t0: performance.now(), heavyFired: true, air: true };
    } else {
      this._left = { t: 0, t0: performance.now(), heavyFired: false, air: false };
    }
  },
  leftUp() {
    this.mouse.left = false;
    if (this._left && !this._left.heavyFired) this.push('light');   // 0.5초 전에 떼면 평타
    this._left = null;
  },

  onKeyDown(code) {
    const map = {
      Space: 'jump', ShiftLeft: 'dodge', ShiftRight: 'dodge',
      KeyQ: 'q', KeyE: 'e', KeyR: 'r', Tab: 'observe',
      KeyF: 'interact', KeyM: 'map', Escape: 'pause', Enter: 'confirm',
      Backquote: 'master', KeyH: 'masterPanel',   // 마스터 모드 : ` 진입/나가기, H 패널
    };
    if (map[code]) this.push(map[code]);
    if (code === 'Digit1' || code === 'Digit2' || code === 'Digit3') {
      this._num[code] = { t: 0, t0: performance.now(), fired: false };
    }
  },

  onKeyUp(code) {
    const n = this._num[code];
    if (n) {
      // 0.5초 전에 떼면 태그
      if (!n.fired) this.push('tag', parseInt(code.slice(5), 10) - 1);
      delete this._num[code];
    }
  },

  update(dt) {
    const hold = GL.CONFIG.rules.holdTime;
    // 좌클릭 0.5초 홀딩 = 강공격
    // 홀딩은 실제 시간으로 잼 (느린 기기에서도 0.5초가 0.5초)
    const now = performance.now();
    if (this._left && !this._left.heavyFired) {
      this._left.t = (now - this._left.t0) / 1000;
      if (this._left.t >= hold) { this._left.heavyFired = true; this.push('heavy'); }
    }
    // 숫자키 0.5초 홀딩 = 조력 스킬
    for (const code in this._num) {
      const n = this._num[code];
      n.t = (now - n.t0) / 1000;
      if (!n.fired && n.t >= hold) { n.fired = true; this.push('assist', parseInt(code.slice(5), 10) - 1); }
    }
  },

  // 강공격 차징 진행도(0~1) — UI 표시용
  chargeRatio() {
    if (!this._left || this._left.air) return 0;
    return Math.min(1, (performance.now() - this._left.t0) / 1000 / GL.CONFIG.rules.holdTime);
  },

  lock() {
    try {
      const r = this.canvas.requestPointerLock && this.canvas.requestPointerLock();
      if (r && r.catch) r.catch(() => {});
    } catch (e) { /* 잠금이 막힌 환경: 마우스 이동량으로만 회전 */ }
  },
  unlock() { try { if (document.pointerLockElement) document.exitPointerLock(); } catch (e) {} },

  push(type, value) { this.events.push({ type, value }); },
  consume() { const ev = this.events; this.events = []; return ev; },
};

</script>
<script>
// ===== js/touch.js =====
// ============================================================
// touch.js — 휴대폰 터치 조작
// 왼쪽 엄지 : 가상 조이스틱(끝까지 밀면 대쉬)
// 오른쪽 엄지 : 화면 드래그 = 카메라 회전, 버튼 = 공격·스킬·점프·회피
// 왼쪽 위 파티 카드 : 짧게 = 태그, 0.5초 누르기 = 조력
// 버튼은 키보드/마우스와 같은 행동 이벤트를 GL.Input 에 넣는다.
// ============================================================
GL.Touch = {
  enabled: false,
  joy: { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0, mag: 0, sprint: false },
  cam: { id: null, lx: 0, ly: 0 },
  btnTouch: {},          // touch id → 버튼 id
  pressed: {},           // 버튼 id → true (그리기용)
  buttons: [],

  detect() {
    // 주소 뒤에 ?mobile=1 을 붙이면 휴대폰 조작 강제, ?mobile=0 이면 PC 조작 강제
    const q = (location.search || '').match(/mobile=([01])/);
    this.forced = q ? q[1] : null;
    if (q) return q[1] === '1';
    try { return matchMedia('(pointer: coarse)').matches && (('ontouchstart' in window) || navigator.maxTouchPoints > 0); }   // 터치 노트북은 마우스 조작 유지
    catch (e) { return false; }
  },

  init(canvas) {
    this.enabled = this.detect();
    this.canvas = canvas;
    // 감지를 못 했더라도 첫 터치가 들어오면 휴대폰 조작으로 전환
    window.addEventListener('touchstart', () => {
      if (!this.enabled && this.forced !== '0') { this.enabled = true; if (GL.Main.resize) GL.Main.resize(); }
    }, { capture: true, passive: true });
    const opt = { passive: false };
    canvas.addEventListener('touchstart', (e) => this.onStart(e), opt);
    canvas.addEventListener('touchmove', (e) => this.onMove(e), opt);
    canvas.addEventListener('touchend', (e) => this.onEnd(e), opt);
    canvas.addEventListener('touchcancel', (e) => this.onEnd(e), opt);
  },

  // 화면 크기에 맞춘 버튼 배치 (오른쪽 아래 기준)
  layout(cv) {
    const W = cv.width, H = cv.height;
    const s = GL.U.clamp(Math.min(W, H) / 400, 0.8, 1.4);
    this.s = s;
    const B = (id, ox, oy, r, label, from = 'br') => {
      const x = from === 'tr' ? W + ox * s : W + ox * s, y = from === 'tr' ? oy * s : H + oy * s;
      return { id, x, y, r: r * s, label };
    };
    const list = [
      B('attack', -100, -95, 48, '공격'),
      B('jump', -215, -50, 30, '점프'),
      B('dodge', -40, -185, 28, '회피'),
      B('q', -210, -135, 30, 'Q'),
      B('e', -165, -205, 30, 'E'),
      B('r', -95, -235, 32, 'R'),
      B('observe', -40, -275, 28, '관측'),
      B('pause', -32, 32, 20, 'Ⅱ', 'tr'),
      B('map', -80, 32, 20, '지도', 'tr'),
    ];
    if (GL.Stage.nearInteractable && GL.Stage.nearInteractable()) list.push(B('interact', -300, -60, 30, 'F'));
    this.buttons = list;
    return list;
  },

  hitButton(x, y) {
    for (const b of this.buttons) if (Math.hypot(x - b.x, y - b.y) <= b.r + 8) return b;
    return null;
  },
  hitParty(x, y) {
    const R = GL.UI.partyRects || [];
    for (let i = 0; i < R.length; i++) { const r = R[i]; if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i; }
    return -1;
  },

  tryFullscreen() {
    if (this._fsTried) return; this._fsTried = true;
    try {
      const el = document.documentElement;
      const r = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen && el.webkitRequestFullscreen());
      if (r && r.then) r.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
    } catch (e) { /* 전체화면을 지원하지 않는 기기 */ }
  },

  onStart(e) {
    e.preventDefault();
    const I = GL.Input, st = GL.Main.state;
    this.tryFullscreen();
    // 세 손가락 탭 = 마스터 모드 진입 / 나가기
    if (e.touches.length >= 3) { I.push('master'); return; }
    if (st !== 'play') {   // 타이틀·일시정지·결과 화면·마스터 패널 : 탭 = 진행 / 버튼 누르기
      const t0 = e.changedTouches[0]; I.mouse.x = t0.clientX; I.mouse.y = t0.clientY;
      I.push('click'); return;
    }
    this.layout(this.canvas);
    for (const t of e.changedTouches) {
      const x = t.clientX, y = t.clientY;
      if (GL.Master.badgeHit(x, y)) { I.push('masterPanel'); continue; }   // MASTER 표시 탭 = 패널
      const b = this.hitButton(x, y);
      if (b) { this.btnTouch[t.identifier] = b.id; this.pressed[b.id] = true; this.press(b.id); continue; }
      const pi = this.hitParty(x, y);
      if (pi >= 0) { this.btnTouch[t.identifier] = 'party' + pi; this.pressed['party' + pi] = true; I.onKeyDown('Digit' + (pi + 1)); continue; }
      if (x < this.canvas.width * 0.45 && !this.joy.active) {
        Object.assign(this.joy, { active: true, id: t.identifier, ox: x, oy: y, x: 0, y: 0, mag: 0, sprint: false });
      } else if (this.cam.id === null) {
        this.cam = { id: t.identifier, lx: x, ly: y };
      }
    }
  },

  onMove(e) {
    e.preventDefault();
    const I = GL.Input;
    for (const t of e.changedTouches) {
      if (this.joy.active && t.identifier === this.joy.id) {
        const R = 60 * (this.s || 1);
        const dx = t.clientX - this.joy.ox, dy = t.clientY - this.joy.oy, d = Math.hypot(dx, dy);
        this.joy.mag = d / R;
        const k = d > R ? R / d : 1;
        this.joy.x = dx * k / R; this.joy.y = dy * k / R;
        this.joy.sprint = d > R * 1.3;          // 원 밖까지 밀면 대쉬
      } else if (t.identifier === this.cam.id) {
        I.mouse.dx += (t.clientX - this.cam.lx) * 1.6;
        I.mouse.dy += (t.clientY - this.cam.ly) * 1.2;
        this.cam.lx = t.clientX; this.cam.ly = t.clientY;
      }
    }
  },

  onEnd(e) {
    e.preventDefault();
    const I = GL.Input;
    for (const t of e.changedTouches) {
      const id = this.btnTouch[t.identifier];
      if (id) {
        delete this.btnTouch[t.identifier]; delete this.pressed[id];
        if (id === 'attack') I.leftUp();
        if (id.startsWith('party')) I.onKeyUp('Digit' + (parseInt(id.slice(5), 10) + 1));
      }
      if (this.joy.active && t.identifier === this.joy.id) Object.assign(this.joy, { active: false, id: null, x: 0, y: 0, mag: 0, sprint: false });
      if (t.identifier === this.cam.id) this.cam.id = null;
    }
  },

  press(id) {
    const I = GL.Input;
    switch (id) {
      case 'attack': I.leftDown(false); break;
      // 공중에서 점프 버튼 = 점프 강공격 (PC의 Ctrl + 좌클릭)
      case 'jump': I.push(I.isAirborne() ? 'jumpHeavy' : 'jump'); break;
      case 'dodge': I.push('dodge'); break;
      case 'q': I.push('q'); break;
      case 'e': I.push('e'); break;
      case 'r': I.push('r'); break;
      case 'observe': I.push('observe'); break;
      case 'interact': I.push('interact'); break;
      case 'pause': I.push('pause'); break;
      case 'map': I.push('map'); break;
    }
  },

  // ---------- 그리기 ----------
  draw(ctx, cv) {
    if (!this.enabled || GL.Main.state !== 'play') return;
    const list = this.layout(cv), ch = GL.Party.active(), W = GL.World, p = GL.Party.player, R = GL.CONFIG.rules;
    ctx.save();
    // 조이스틱
    const s = this.s, jr = 60 * s;
    if (this.joy.active) {
      const j = this.joy;
      ctx.strokeStyle = j.sprint ? 'rgba(255,224,102,0.8)' : 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3;
      ctx.fillStyle = 'rgba(10,20,40,0.35)';
      ctx.beginPath(); ctx.arc(j.ox, j.oy, jr, 0, 6.283); ctx.fill(); ctx.stroke();
      ctx.fillStyle = j.sprint ? 'rgba(255,224,102,0.85)' : 'rgba(255,255,255,0.75)';
      ctx.beginPath(); ctx.arc(j.ox + j.x * jr, j.oy + j.y * jr, 24 * s, 0, 6.283); ctx.fill();
      if (j.sprint) { ctx.font = `bold ${12 * s}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText('대쉬', j.ox, j.oy - jr - 8); }
    } else {
      // 처음 위치 안내
      const gx = cv.width * 0.16, gy = cv.height - 110 * s;
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(gx, gy, jr, 0, 6.283); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.font = `${11 * s}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('이동', gx, gy + 4);
    }
    // 버튼
    for (const b of list) {
      let cd = 0, cdMax = 0, ready = true, color = '#e8f1ff', label = b.label;
      if (ch && (b.id === 'q' || b.id === 'e')) { cd = ch.cd[b.id]; cdMax = ch.cfg[b.id].cd; ready = cd <= 0; color = ch.color; }
      if (ch && b.id === 'r') { ready = ch.ult >= ch.ultMax; color = '#ffe066'; }
      if (b.id === 'observe') { const o = W.observe; cd = o.on ? 0 : o.cd; cdMax = R.observeCooldown; ready = o.on || o.cd <= 0; color = '#3fe0a8'; if (o.on) label = `관측 ${o.t.toFixed(0)}`; }
      if (b.id === 'dodge') { ready = p.dodgeCharges > 0; label = `회피 ${p.dodgeCharges}`; }
      if (b.id === 'jump' && GL.Party.isAirborne()) { label = '낙하'; color = '#ffffff'; }
      if (b.id === 'attack' && GL.Party.isAirborne()) label = '점프 공격';
      const down = this.pressed[b.id];
      ctx.globalAlpha = 1;
      ctx.fillStyle = down ? 'rgba(60,90,140,0.75)' : 'rgba(8,14,26,0.55)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill();
      if (cd > 0 && cdMax > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + 6.283 * (cd / cdMax)); ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = ready ? color : 'rgba(120,150,190,0.4)'; ctx.lineWidth = b.id === 'attack' ? 3 : 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.stroke();
      if (b.id === 'r' && ch) { // 궁극기 게이지 테두리
        ctx.strokeStyle = '#7aa7ff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 4, -Math.PI / 2, -Math.PI / 2 + 6.283 * (ch.ult / ch.ultMax)); ctx.stroke();
      }
      if (b.id === 'attack') { const cr = GL.Input.chargeRatio(); if (cr > 0.1) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, -Math.PI / 2, -Math.PI / 2 + 6.283 * cr); ctx.stroke(); } }
      ctx.fillStyle = ready ? color : '#6b7c93';
      ctx.textAlign = 'center';
      ctx.font = `bold ${(b.r > 40 ? 15 : b.r > 25 ? 13 : 11) * (b.label.length > 2 ? 0.9 : 1.15)}px sans-serif`;
      ctx.fillText(cd > 0 ? cd.toFixed(0) : label, b.x, b.y + 5);
      if (ch && (b.id === 'q' || b.id === 'e' || b.id === 'r')) {
        ctx.font = `${9 * s}px sans-serif`; ctx.fillStyle = '#c9d6e6';
        const nm = ch.cfg[b.id].name; ctx.fillText(nm.length > 6 ? nm.slice(0, 6) + '…' : nm, b.x, b.y + b.r + 11 * s);
      }
    }
    ctx.restore();
  },

  // 세로 화면 안내
  drawRotate(ctx, cv) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText('휴대폰을 가로로 돌려주세요', cv.width / 2, cv.height / 2 - 10);
    ctx.fillStyle = '#9fb3c8'; ctx.font = '14px sans-serif';
    ctx.fillText('이클립스 세븐은 가로 화면에서 플레이합니다', cv.width / 2, cv.height / 2 + 20);
    ctx.strokeStyle = '#3fe0a8'; ctx.lineWidth = 3;
    ctx.strokeRect(cv.width / 2 - 22, cv.height / 2 - 110, 44, 72);
  },
};

</script>
<script>
// ===== js/combat.js =====
// ============================================================
// combat.js — 피해 공식, 파쇄 게이지, 그로기, 관측, 판정, 이펙트
// ============================================================
GL.World = {
  reset() {
    this.time = 0;
    this.enemies = [];
    this.pShots = [];     // 플레이어 투사체
    this.eShots = [];     // 적 투사체
    this.tele = [];       // 적 공격 예고(텔레그래프)
    this.fields = [];     // 장판 (지연의 늪, 균열, 공간 절단 지대)
    this.fx = [];         // 이펙트
    this.texts = [];      // 떠오르는 숫자
    this.pickups = [];    // 회복 데이터 (F로 줍기)
    this.shake = 0;
    this.observe = { on: false, t: 0, cd: 0 };
    this.buffs = { shield: 0, shieldT: 0, fortress: 0, barrier: 0, defDown: 0, weakAll: 0 };
    this.mono = 0;        // 화면 흑백 정도 (전멸기)
  },
};

GL.Combat = {
  R: () => GL.CONFIG.rules,

  // ---------- 관측 ----------
  toggleObserve() {
    const o = GL.World.observe, R = this.R();
    if (o.on) { o.on = false; o.cd = R.observeCooldown; return; }
    if (o.cd > 0) { this.text(GL.Party.player.x, GL.Party.player.y - 40, `관측 대기 ${o.cd.toFixed(1)}초`, '#9fb3c8', 14); return; }
    o.on = true; o.t = R.observeDuration;
    this.ring(GL.Party.player.x, GL.Party.player.y, 400, '#3fe0a8', 0.5);
  },
  updateObserve(dt) {
    const o = GL.World.observe;
    if (o.on) { o.t -= dt; if (o.t <= 0) { o.on = false; o.cd = this.R().observeCooldown; } }
    else if (o.cd > 0) o.cd = Math.max(0, o.cd - dt);
  },
  // 약점이 지금 보이는가 (관측 중 / 이안 E / 케이 조력)
  weakVisible(e) {
    if (!e.weakExposed || !e.weakExposed()) return false;
    return GL.World.observe.on || GL.World.buffs.weakAll > 0 || e.markWeak > 0;
  },

  // ---------- 플레이어 → 적 ----------
  hitEnemy(e, ch, coef, frac, opts = {}) {
    if (!e || e.dead) return 0;
    const R = this.R();
    const weak = this.weakVisible(e);
    const info = { dmgMul: 1, fracMul: 1, blocked: false, silent: false };
    if (weak) {
      info.fracMul *= R.weakFracMul;
      if (ch.id === 'ian') info.fracMul *= 1 + GL.CONFIG.chars.ian.passive.weakFracBonus;
      if (e.markWeak > 0) info.dmgMul *= 1 + GL.CONFIG.chars.ian.e.weakDmgBonus;
    }
    // 패링 반사는 가드·보호막을 무시하고 들어감
    if (e.onHit && !opts.parry) e.onHit(info, opts, weak, ch);
    if (e.dead) return 0;                       // 기믹으로 즉사 처리된 경우
    if (info.blocked) {
      if (!info.silent) this.text(e.x, e.y - e.r - 10, '차단', '#9fb3c8', 14);
      this.sparks(e.x, e.y, 4, '#cfe3ff');
      return 0;
    }
    const groggy = e.groggy > 0;
    let def = groggy ? 0 : e.def * (1 - GL.World.buffs.defDown - (e.defDownT > 0 ? e.defDown : 0));
    def = Math.max(0, def);
    let critRate = R.critRate + (ch.id === 'kay' && weak ? GL.CONFIG.chars.kay.passive.weakCritBonus : 0);
    if (GL.Party.critBuff > 0) critRate += 0.3;
    const crit = groggy || Math.random() < critRate;
    let dmg = ch.atk * coef / 100 * 100 / (100 + def) * info.dmgMul;
    if (crit) dmg *= R.critMul;
    if (groggy) dmg *= R.groggyDmgMul;
    if (opts.fixed) dmg = opts.fixed;
    dmg = Math.round(dmg * GL.Master.dmgMul());

    e.hp -= dmg;
    if (!groggy && frac > 0 && e.fracMax > 0) {
      e.frac -= frac * info.fracMul;
      if (e.frac <= 0) { e.frac = 0; e.startGroggy(); }
    }
    ch.ult = Math.min(ch.ultMax, ch.ult + (opts.skill ? R.ultPerSkillHit : R.ultPerHit));
    if (!e.boss) {
      if (opts.stun) e.stun = Math.max(e.stun, opts.stun);
      if (opts.knock && opts.dir !== undefined) { e.x += Math.cos(opts.dir) * opts.knock; e.y += Math.sin(opts.dir) * opts.knock; }
    }
    if (opts.bleed) { e.bleedT = opts.bleed.t; e.bleedDps = opts.bleed.dps; e.bleedCh = ch; }
    if (opts.defDown) { e.defDown = opts.defDown.v; e.defDownT = opts.defDown.t; }

    const col = groggy ? '#ffe066' : (weak ? '#3fe0a8' : (crit ? '#ffd27a' : '#ffffff'));
    this.text(e.x + GL.U.rand(-12, 12), e.y - e.r - 6, (crit ? '★' : '') + dmg, col, crit || groggy ? 20 : 15);
    if (weak && frac > 0) this.sparks(e.x, e.y, 5, '#3fe0a8');
    if (frac >= 6) this.shards(e.x, e.y, 6);
    e.hitFlash = 0.08;
    if (e.hp <= 0) e.die();
    return dmg;
  },

  // 범위 판정으로 여러 적을 한 번에 때림
  hitArea(shape, ch, coef, frac, opts = {}) {
    let n = 0;
    GL.Master.recordShape(shape);
    for (const e of GL.World.enemies) {
      if (e.dead || (opts.hitSet && opts.hitSet.has(e))) continue;
      if (this.inShape(shape, e)) {
        this.hitEnemy(e, ch, coef, frac, { ...opts, dir: shape.dir !== undefined ? shape.dir : GL.U.angleTo(shape, e) });
        if (opts.hitSet) opts.hitSet.add(e);
        n++;
      }
    }
    // 파쇄 속성 공격은 날아오는 적 투사체를 베어서 반사
    if (opts.shatter) {
      for (const s of GL.World.eShots) {
        if (s.dead) continue;
        if (this.inShape(shape, s)) {
          s.dead = true;
          this.shards(s.x, s.y, 5);
          this.text(s.x, s.y - 14, '투사체 파쇄', '#3fe0a8', 13);
          if (s.src && !s.src.dead) {
            const a = GL.U.angleTo(s, s.src);
            GL.World.pShots.push({ x: s.x, y: s.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, r: 8, life: 1.5, ch, coef: 100, frac: 6, opts: { shatter: true }, color: '#3fe0a8', hit: new Set() });
          }
        }
      }
    }
    // 보스 기믹의 매듭(관측 중에만 보이고 맞출 수 있음)
    if (opts.shatter && GL.Boss) GL.Boss.hitKnots(shape, frac, ch);
    return n;
  },

  inShape(s, t) {
    const U = GL.U;
    if (s.kind === 'arc') return U.inArc(s, s.dir, s.r, s.arc, t);
    if (s.kind === 'line') return U.inLine(s, s.dir, s.len, s.w, t);
    return U.inCircle(s, s.r, t);
  },

  // ---------- 적 → 플레이어 ----------
  hurtPlayer(atk, coef, opts = {}) {
    const P = GL.Party, p = P.player, ch = P.active(), W = GL.World;
    if (!ch || ch.hp <= 0 || GL.Main.state !== 'play') return false;
    if (GL.Master.god()) { if (Math.random() < 0.3) this.text(p.x, p.y - 34, '무적', '#ff6b8a', 12); return false; }   // 마스터 모드
    if (opts.ground && p.z > 25) return false;                 // 점프 중엔 바닥 공격 회피
    if (p.iframe > 0 && !opts.unavoidable) { this.text(p.x, p.y - 34, '회피', '#cfe3ff', 14); return false; }
    if (W.buffs.barrier > 0 && !opts.unavoidable) { this.text(p.x, p.y - 34, '절대 경계', '#e0b54a', 14); return false; }

    // 바렌 퍼펙트 가드 : 받은 피해를 반사하고 파쇄 게이지를 깎음
    if (ch.id === 'baren' && p.guard > 0 && !opts.unavoidable) {
      const hv = GL.CONFIG.chars.baren.heavy;
      const raw = atk * coef / 100;
      if (opts.src && !opts.src.dead) {
        this.hitEnemy(opts.src, ch, 0, hv.frac * (opts.red ? hv.redMul : 1), { shatter: true, skill: true, parry: true, fixed: Math.round(raw) });
      }
      this.text(p.x, p.y - 40, opts.red ? '퍼펙트 가드! 파쇄 x2' : '퍼펙트 가드!', '#ffe066', 18);
      this.ring(p.x, p.y, 70, '#ffe066', 0.35);
      W.shake = Math.max(W.shake, 6);
      return false;
    }

    let dmg = opts.ratio ? ch.maxHp * opts.ratio : atk * coef / 100 * 100 / (100 + ch.def);
    if (W.buffs.fortress > 0) dmg *= 1 - GL.CONFIG.chars.baren.assist.reduce;
    dmg = Math.round(dmg);
    if (W.buffs.shield > 0) {
      const ab = Math.min(W.buffs.shield, dmg);
      W.buffs.shield -= ab; dmg -= ab;
      if (ab > 0) this.text(p.x + 14, p.y - 30, `-${ab}`, '#9fe8ff', 13);
    }
    if (ch.id === 'baren' && opts.src && !opts.src.dead && dmg > 0) {
      // 패시브 노이즈 리플렉션 : 받은 피해 20% 반사
      this.hitEnemy(opts.src, ch, 0, 0, { fixed: Math.max(1, Math.round(dmg * GL.CONFIG.chars.baren.passive.reflect)) });
    }
    if (dmg <= 0) return true;
    ch.hp -= dmg;
    ch.ult = Math.min(ch.ultMax, ch.ult + this.R().ultPerHurt);
    this.text(p.x, p.y - 30, `-${dmg}`, '#ff5a6e', 17);
    W.shake = Math.max(W.shake, opts.ratio ? 2 : 7);
    p.hurtFlash = 0.15;
    if (ch.hp <= 0) { ch.hp = 0; P.onActiveDown(); }
    return true;
  },

  // ---------- 예고 공격 / 장판 / 투사체 ----------
  telegraph(t) { t.t = 0; GL.World.tele.push(t); return t; },

  update(dt) {
    const W = GL.World;
    this.updateObserve(dt);
    if (W.buffs.shieldT > 0) { W.buffs.shieldT -= dt; if (W.buffs.shieldT <= 0) W.buffs.shield = 0; }
    if (W.buffs.fortress > 0) W.buffs.fortress -= dt;
    if (W.buffs.barrier > 0) W.buffs.barrier -= dt;
    if (W.buffs.weakAll > 0) { W.buffs.weakAll -= dt; if (W.buffs.weakAll <= 0) W.buffs.defDown = 0; }

    // 예고 → 발동
    for (const t of W.tele) {
      if (t.owner && t.owner.dead) { t.dead = true; continue; }
      t.t += dt;
      if (t.follow && t.owner) { t.x = t.owner.x; t.y = t.owner.y; }
      if (t.t >= t.warn) {
        t.dead = true;
        if (t.onFire) t.onFire(t);
        else if (this.inShape(t, { x: GL.Party.player.x, y: GL.Party.player.y, r: 14 })) {
          this.hurtPlayer(t.atk, t.coef, { red: t.red, src: t.owner, ground: t.ground });
        }
        this.ring(t.x, t.y, t.r || 60, t.red ? '#ff3b5c' : '#ff9a3d', 0.25);
      }
    }
    W.tele = W.tele.filter(t => !t.dead);

    // 장판
    const p = GL.Party.player;
    p.slow = 0;
    for (const f of W.fields) {
      f.life -= dt;
      if (f.kind === 'slow' && GL.U.inCircle(f, f.r, p) && p.z < 20) p.slow = f.slow;
      if (f.kind === 'rift') {
        f.tick -= dt;
        if (f.armed === false) { f.arm -= dt; if (f.arm <= 0) f.armed = true; }
        else if (f.tick <= 0 && GL.U.inCircle(f, f.r, p) && p.z < 20) { f.tick = 0.5; this.hurtPlayer(0, 0, { ratio: f.dps * 0.5, ground: true }); }
      }
      if (f.kind === 'cut') {
        f.tick -= dt;
        if (f.tick <= 0) { f.tick = 0.5; this.hitArea(f.shape, f.ch, f.coef * 0.5, 0, {}); }
      }
    }
    W.fields = W.fields.filter(f => f.life > 0);

    // 플레이어 투사체
    for (const s of W.pShots) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life <= 0) { s.dead = true; continue; }
      for (const e of W.enemies) {
        if (e.dead || s.hit.has(e)) continue;
        if (GL.U.inCircle(s, s.r, e)) {
          s.hit.add(e);
          this.hitEnemy(e, s.ch, s.coef, s.frac, { ...s.opts, dir: Math.atan2(s.vy, s.vx) });
          if (!s.pierce) { s.dead = true; break; }
        }
      }
    }
    W.pShots = W.pShots.filter(s => !s.dead);

    // 적 투사체
    for (const s of W.eShots) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life <= 0) { s.dead = true; continue; }
      if (GL.U.inCircle(s, s.r, { x: p.x, y: p.y, r: 14 }) && p.z < 30) {
        s.dead = true;
        this.hurtPlayer(s.atk, s.coef, { src: s.src });
      }
    }
    W.eShots = W.eShots.filter(s => !s.dead);

    // 이펙트/텍스트
    for (const f of W.fx) { f.t += dt; if (f.vx) { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; } }
    W.fx = W.fx.filter(f => f.t < f.life);
    for (const t of W.texts) t.t += dt;
    W.texts = W.texts.filter(t => t.t < 0.9);
    if (W.shake > 0) W.shake = Math.max(0, W.shake - 30 * dt);
  },

  // ---------- 이펙트 ----------
  text(x, y, str, color = '#fff', size = 15) { GL.World.texts.push({ x, y, str, color, size, t: 0 }); },
  ring(x, y, r, color, life = 0.3) { GL.World.fx.push({ kind: 'ring', x, y, r, color, life, t: 0 }); },
  slash(x, y, dir, r, arc, color, life = 0.18) { GL.World.fx.push({ kind: 'slash', x, y, dir, r, arc, color, life, t: 0 }); },
  line(x, y, dir, len, w, color, life = 0.2) { GL.World.fx.push({ kind: 'line', x, y, dir, len, w, color, life, t: 0 }); },
  sparks(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = GL.U.rand(80, 220);
      GL.World.fx.push({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, life: 0.35, t: 0 });
    }
  },
  // 유리 파편 (파쇄 연출)
  shards(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = GL.U.rand(60, 260);
      GL.World.fx.push({ kind: 'shard', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rot: Math.random() * 6, size: GL.U.rand(4, 9), life: 0.6, t: 0 });
    }
  },
};

</script>
<script>
// ===== js/party.js =====
// ============================================================
// party.js — 3인 파티 (이안 · 바렌 · 케이), 태그, 조력, 평타/강공격/스킬
// ============================================================
GL.Party = {
  init() {
    const C = GL.CONFIG;
    this.members = C.partyOrder.map(id => {
      const c = C.chars[id];
      return {
        id, cfg: c, name: c.name, color: c.color,
        maxHp: c.hp, hp: c.hp, atk: c.atk, def: c.def,
        ultMax: c.ultMax, ult: 0,
        cd: { q: 0, e: 0, assist: 0 }, combo: 0, comboT: 0,
      };
    });
    this.activeIdx = 0;
    this.tagCd = 0;
    this.critBuff = 0;
    this.timers = [];
    this.player = {
      x: 0, y: 0, z: 0, vz: 0, r: 14, facing: 0,
      iframe: 0, dodgeCharges: C.rules.dodgeCharges, dodgeRe: 0,
      lock: 0, guard: 0, dash: null, plunge: null, slow: 0, hurtFlash: 0, buffer: null, moving: false, moveDir: null,
      anim: { kind: 'idle', t: 0, dur: 1, step: 0 }, walk: 0,
    };
  },

  active() { return this.members[this.activeIdx]; },
  // 애니메이션 상태 (assets/characters.js 가 읽어서 자세를 만듦)
  setAnim(kind, dur, step = 0) { this.player.anim = { kind, t: 0, dur, step }; },
  isAirborne() { return this.player.z > 0.5; },
  later(t, fn) { this.timers.push({ t, fn }); },

  // ---------- 입력 이벤트 처리 ----------
  handle(ev) {
    const ch = this.active();
    if (!ch || ch.hp <= 0) return;
    switch (ev.type) {
      case 'light': this.light(); break;
      case 'heavy': this.heavy(); break;
      case 'jumpAtk': this.jumpAttack(false); break;
      case 'jumpHeavy': this.jumpAttack(true); break;
      case 'jump': this.jump(); break;
      case 'dodge': this.dodge(); break;
      case 'q': this.skill('q'); break;
      case 'e': this.skill('e'); break;
      case 'r': this.ultimate(); break;
      case 'observe': GL.Combat.toggleObserve(); break;
      case 'tag': this.tag(ev.value); break;
      case 'assist': this.assist(ev.value); break;
    }
  },

  // ---------- 이동 / 타이머 ----------
  update(dt) {
    const p = this.player, R = GL.CONFIG.rules, I = GL.Input;
    for (const t of this.timers) { t.t -= dt; if (t.t <= 0 && !t.done) { t.done = true; t.fn(); } }
    this.timers = this.timers.filter(t => !t.done);

    for (const m of this.members) {
      m.cd.q = Math.max(0, m.cd.q - dt); m.cd.e = Math.max(0, m.cd.e - dt); m.cd.assist = Math.max(0, m.cd.assist - dt);
      if (m.comboT > 0) { m.comboT -= dt; if (m.comboT <= 0) m.combo = 0; }
    }
    this.tagCd = Math.max(0, this.tagCd - dt);
    p.iframe = Math.max(0, p.iframe - dt);
    p.hurtFlash = Math.max(0, p.hurtFlash - dt);
    p.guard = Math.max(0, p.guard - dt);
    if (p.dodgeCharges < R.dodgeCharges) {
      p.dodgeRe -= dt;
      if (p.dodgeRe <= 0) p.dodgeCharges = R.dodgeCharges;
    }
    p.lock = Math.max(0, p.lock - dt);
    p.anim.t += dt;
    if (p.anim.kind !== 'idle' && p.anim.t > p.anim.dur) p.anim = { kind: 'idle', t: 0, dur: 1, step: 0 };
    if (p.moving) p.walk += dt * (I.mouse.right || (GL.Touch && GL.Touch.joy.sprint) ? 15 : 10);
    if (p.lock <= 0 && p.buffer) { const b = p.buffer; p.buffer = null; if (b === 'light') this.light(); }

    // 소프트 락온 대상 갱신 (명조 방식 : 카메라 앞쪽 가까운 적)
    this.softTarget = this.findTarget();

    if (p.dash) {
      p.x += p.dash.vx * dt; p.y += p.dash.vy * dt; p.dash.t -= dt;
      if (p.dash.t <= 0) { const end = p.dash.onEnd; p.dash = null; if (end) end(); }
    } else if (p.lock <= 0) {
      // 카메라 기준 이동 : W = 카메라가 보는 방향
      let f = 0, s = 0;
      if (I.keys.KeyW) f += 1; if (I.keys.KeyS) f -= 1;
      if (I.keys.KeyD) s += 1; if (I.keys.KeyA) s -= 1;
      const J = GL.Touch && GL.Touch.joy;
      if (J && J.active && J.mag > 0.15) { f = -J.y; s = J.x; }   // 휴대폰 조이스틱 (화면 위 = 앞)
      const fw = GL.Render.forward(), rt = { x: -fw.y, y: fw.x };
      const mx = fw.x * f + rt.x * s, my = fw.y * f + rt.y * s;
      const len = Math.hypot(mx, my);
      if (len > 0) {
        const sprint = I.mouse.right || (J && J.active && J.sprint);
        let sp = R.moveSpeed * (sprint ? R.sprintMul : 1) * (1 - p.slow) * Math.min(1, len);
        p.x += mx / len * sp * dt; p.y += my / len * sp * dt;
        p.moveDir = Math.atan2(my, mx);
        // 캐릭터는 이동 방향으로 부드럽게 돌아섬
        p.facing += GL.U.angDiff(p.facing, p.moveDir) * Math.min(1, dt * 14);
        p.moving = true;
      } else { p.moveDir = null; p.moving = false; }
    } else p.moving = false;

    // 점프 / 낙하 공격
    if (p.z > 0 || p.vz > 0) {
      p.vz -= R.gravity * dt; p.z += p.vz * dt;
      if (p.z <= 0) { p.z = 0; p.vz = 0; if (p.plunge) this.landPlunge(); }
    }
    GL.Stage.clamp(p);
  },

  // ---------- 조준 : 소프트 락온 ----------
  // 카메라 앞쪽 400 안의 가장 가까운 적 → 없으면 가까운 적(170 안) → 없으면 이동 방향/카메라 방향
  findTarget() {
    const p = this.player, fw = GL.Render.forward(), cam = Math.atan2(fw.y, fw.x);
    let best = null, bs = Infinity;
    // 관측 중에는 보스 기믹의 매듭을 우선 조준
    if (GL.World.observe.on) {
      for (const k of GL.Boss.knots) {
        if (k.frac <= 0) continue;
        const d = GL.U.dist(p, k);
        if (d < 420 && d < bs) { bs = d; best = k; }
      }
      if (best) return best;
    }
    for (const e of GL.World.enemies) {
      if (e.dead) continue;
      const d = GL.U.dist(p, e);
      if (d > 400) continue;
      const off = Math.abs(GL.U.angDiff(cam, GL.U.angleTo(p, e)));
      if (off > GL.U.deg(80) && d > 170) continue;
      const score = d + off * 120;
      if (score < bs) { bs = score; best = e; }
    }
    return best;
  },
  aim() {
    const p = this.player, t = (this.softTarget = this.findTarget());
    if (t && !t.dead) p.facing = GL.U.angleTo(p, t);
    else if (p.moveDir !== null && p.moveDir !== undefined) p.facing = p.moveDir;
    else { const fw = GL.Render.forward(); p.facing = Math.atan2(fw.y, fw.x); }
  },

  // ---------- 평타 1~4타 ----------
  light() {
    const p = this.player, ch = this.active();
    if (p.z > 0.5) return;
    if (p.lock > 0) { if (p.lock < 0.2) p.buffer = 'light'; return; }
    this.aim();
    ch.combo = ch.comboT > 0 ? (ch.combo % 4) + 1 : 1;
    ch.comboT = GL.CONFIG.rules.comboWindow;
    const d = ch.cfg.light[ch.combo - 1];
    const step4 = ch.combo === 4;
    p.lock = step4 ? 0.42 : 0.26;
    this.setAnim('light', p.lock + 0.08, ch.combo);
    const shatter = step4;                     // 마지막 4타 = 파쇄 속성

    if (d.lunge) { p.x += Math.cos(p.facing) * d.lunge; p.y += Math.sin(p.facing) * d.lunge; }
    if (d.projectile) {
      for (let i = 0; i < d.count; i++) {
        const a = p.facing + GL.U.deg((i - (d.count - 1) / 2) * 14);
        GL.World.pShots.push({ x: p.x, y: p.y, vx: Math.cos(a) * 600, vy: Math.sin(a) * 600, r: 6, life: 0.6, ch, coef: d.coef / d.count, frac: d.frac / d.count,
          opts: { shatter, defDown: { v: d.defDown, t: d.defDownTime } }, color: ch.color, hit: new Set(), dagger: true });
      }
      p.x -= Math.cos(p.facing) * 30; p.y -= Math.sin(p.facing) * 30;
      return;
    }
    const shape = { kind: 'arc', x: p.x, y: p.y, dir: p.facing, r: d.range, arc: GL.U.deg(d.arc) };
    GL.Combat.hitArea(shape, ch, d.coef, d.frac, { shatter, stun: d.stun || 0.15, knock: d.knock || 8 });
    GL.Combat.slash(p.x, p.y, p.facing, d.range, GL.U.deg(Math.min(d.arc, 359)), step4 ? '#ffffff' : ch.color);
    if (step4) GL.Combat.shards(p.x + Math.cos(p.facing) * 50, p.y + Math.sin(p.facing) * 50, 8);
  },

  // ---------- 강공격 (좌클릭 0.5초 홀딩) ----------
  heavy() {
    const p = this.player, ch = this.active(), h = ch.cfg.heavy;
    if (p.z > 0.5 || p.dash) return;
    ch.combo = 0; this.aim();
    this.setAnim(ch.id === 'baren' ? 'guard' : 'heavy', ch.id === 'baren' ? h.guardTime : 0.5);
    if (ch.id === 'ian') {
      p.lock = 0.45;
      const shape = { kind: 'line', x: p.x, y: p.y, dir: p.facing, len: h.range, w: h.width };
      GL.Combat.hitArea(shape, ch, h.coef, h.frac, { shatter: true, stun: 0.5, knock: 20 });
      GL.Combat.line(p.x, p.y, p.facing, h.range, h.width, '#c8fff0', 0.3);
      GL.Combat.shards(p.x + Math.cos(p.facing) * 90, p.y + Math.sin(p.facing) * 90, 12);
      GL.World.fields.push({ kind: 'cut', shape, x: shape.x, y: shape.y, r: h.range, life: h.fieldTime, tick: 0.5, ch, coef: h.fieldCoef });
      GL.World.shake = 5;
    } else if (ch.id === 'baren') {
      p.lock = h.guardTime; p.guard = h.guardTime;
      GL.Combat.text(p.x, p.y - 36, '가드', '#e0b54a', 14);
    } else if (ch.id === 'kay') {
      p.lock = 0.4; p.iframe = Math.max(p.iframe, 0.25);
      const back = p.facing + Math.PI;
      p.dash = { t: 0.12, vx: Math.cos(back) * h.backstep / 0.12, vy: Math.sin(back) * h.backstep / 0.12,
        onEnd: () => {
          for (let i = 0; i < h.count; i++) {
            const a = p.facing + GL.U.deg((i - (h.count - 1) / 2) * 9);
            GL.World.pShots.push({ x: p.x, y: p.y, vx: Math.cos(a) * 720, vy: Math.sin(a) * 720, r: 7, life: 0.7, ch, coef: h.coef / h.count, frac: h.frac / h.count,
              opts: { shatter: true }, color: '#e6d6ff', hit: new Set(), dagger: true, pierce: true });
          }
        } };
    }
  },

  // ---------- 점프 / 점프 공격 ----------
  jump() {
    const p = this.player;
    if (p.z > 0.5 || p.lock > 0 || p.dash) return;
    p.vz = GL.CONFIG.rules.jumpVel;
    this.setAnim('jump', 0.7);
  },
  jumpAttack(isHeavy) {
    const p = this.player;
    if (p.z <= 0.5 || p.plunge) return;
    p.plunge = isHeavy ? 'heavy' : 'light'; this.aim(); this.setAnim('plunge', 0.6);
    p.vz = isHeavy ? -1400 : -900;
  },
  landPlunge() {
    const p = this.player, ch = this.active();
    const d = p.plunge === 'heavy' ? ch.cfg.jumpHeavy : ch.cfg.jump;
    const heavy = p.plunge === 'heavy';
    p.plunge = null; p.lock = 0.25; this.setAnim('land', 0.3);
    GL.Combat.hitArea({ kind: 'circle', x: p.x, y: p.y, r: d.radius }, ch, d.coef, d.frac, { shatter: heavy, stun: d.stun || 0.3, knock: 25 });
    GL.Combat.ring(p.x, p.y, d.radius, heavy ? '#ffffff' : ch.color, 0.35);
    GL.Combat.shards(p.x, p.y, heavy ? 14 : 6);
    GL.World.shake = heavy ? 8 : 4;
  },

  // ---------- 회피 (Shift) ----------
  dodge() {
    const p = this.player, R = GL.CONFIG.rules;
    if (p.dodgeCharges <= 0 || p.z > 0.5) return;
    p.dodgeCharges--;
    if (p.dodgeCharges === 0) p.dodgeRe = R.dodgeRecharge;
    const a = p.moveDir !== null && p.moveDir !== undefined ? p.moveDir : p.facing;
    const t = 0.18;
    p.dash = { t, vx: Math.cos(a) * R.dodgeDistance / t, vy: Math.sin(a) * R.dodgeDistance / t };
    p.iframe = R.dodgeIframe; p.lock = 0; p.guard = 0; p.buffer = null;
    this.setAnim('dodge', 0.3);
  },

  // ---------- 스킬 Q / E ----------
  skill(key) {
    const p = this.player, ch = this.active(), s = ch.cfg[key];
    if (p.z > 0.5 || p.dash) return;
    if (ch.cd[key] > 0) { GL.Combat.text(p.x, p.y - 36, `${key.toUpperCase()} ${ch.cd[key].toFixed(1)}초`, '#9fb3c8', 13); return; }
    ch.cd[key] = s.cd; ch.combo = 0; p.guard = 0; this.aim();
    this.setAnim('skill' + key.toUpperCase(), 0.45);
    const C = GL.Combat, f = p.facing, opt = { shatter: true, skill: true };
    C.text(p.x, p.y - 44, s.name, ch.color, 15);

    if (ch.id === 'ian' && key === 'q') {
      const shape = { kind: 'line', x: p.x, y: p.y, dir: f, len: s.dash + 20, w: 60 };
      C.hitArea(shape, ch, s.coef, s.frac, { ...opt, stun: s.stun });
      C.line(p.x, p.y, f, s.dash + 20, 30, '#3fe0a8', 0.3);
      p.dash = { t: 0.15, vx: Math.cos(f) * s.dash / 0.15, vy: Math.sin(f) * s.dash / 0.15 };
      p.iframe = Math.max(p.iframe, 0.15);
    } else if (ch.id === 'ian' && key === 'e') {
      let n = 0;
      for (const e of GL.World.enemies) if (!e.dead && GL.U.dist(p, e) <= s.radius) { e.markWeak = s.dur; n++; }
      C.ring(p.x, p.y, s.radius, '#3fe0a8', 0.5);
      p.lock = 0.2;
    } else if (ch.id === 'baren' && key === 'q') {
      // 돌진 경로 전체를 한 번에 판정
      C.hitArea({ kind: 'line', x: p.x, y: p.y, dir: f, len: s.dash + 40, w: 70 }, ch, s.coef, s.frac, { ...opt, stun: 0.6, knock: 50 });
      C.line(p.x, p.y, f, s.dash + 40, 40, '#e0b54a', 0.3);
      p.dash = { t: 0.22, vx: Math.cos(f) * s.dash / 0.22, vy: Math.sin(f) * s.dash / 0.22 };
    } else if (ch.id === 'baren' && key === 'e') {
      C.hitArea({ kind: 'arc', x: p.x, y: p.y, dir: f, r: s.range, arc: GL.U.deg(s.arc) }, ch, s.coef, s.frac, { ...opt, stun: 0.8, knock: 40 });
      C.slash(p.x, p.y, f, s.range, GL.U.deg(s.arc), '#e0b54a', 0.3);
      p.lock = 0.35; GL.World.shake = 6;
    } else if (ch.id === 'kay' && key === 'q') {
      GL.World.pShots.push({ x: p.x, y: p.y, vx: Math.cos(f) * 700, vy: Math.sin(f) * 700, r: 8, life: 0.8, ch, coef: s.coef, frac: s.frac,
        opts: { ...opt, bleed: { t: s.bleedTime, dps: ch.atk * s.bleedCoef / 100 } }, color: '#ff6b9a', hit: new Set(), dagger: true });
      p.lock = 0.2;
    } else if (ch.id === 'kay' && key === 'e') {
      let best = null, bd = s.range;
      for (const e of GL.World.enemies) { if (e.dead) continue; const d = GL.U.dist(p, e); if (d < bd) { bd = d; best = e; } }
      if (!best) { ch.cd.e = 0; C.text(p.x, p.y - 30, '대상 없음', '#9fb3c8', 13); return; }
      const a = GL.U.angleTo(p, best);
      p.x = best.x + Math.cos(a) * (best.r + 26); p.y = best.y + Math.sin(a) * (best.r + 26);
      p.iframe = Math.max(p.iframe, 0.25);
      C.hitEnemy(best, ch, s.coef, s.frac, { ...opt, stun: 0.4 });
      C.slash(p.x, p.y, a + Math.PI, 60, GL.U.deg(120), '#b48cff');
      p.lock = 0.25;
    }
  },

  // ---------- 궁극기 R ----------
  ultimate() {
    const p = this.player, ch = this.active(), s = ch.cfg.r, C = GL.Combat;
    if (p.z > 0.5 || p.dash) return;
    if (ch.ult < ch.ultMax) { C.text(p.x, p.y - 36, `궁극기 ${Math.floor(ch.ult)}/${ch.ultMax}`, '#9fb3c8', 13); return; }
    ch.ult = 0; ch.combo = 0; p.guard = 0; this.aim();
    this.setAnim('ult', 0.8);
    C.text(p.x, p.y - 56, s.name, '#ffffff', 22);
    if (ch.id === 'ian') {
      p.lock = 0.6; p.iframe = 0.6;
      this.later(0.25, () => {
        C.hitArea({ kind: 'circle', x: p.x, y: p.y, r: s.radius }, ch, s.coef, s.frac, { shatter: true, skill: true, stun: 1 });
        C.ring(p.x, p.y, s.radius, '#ffffff', 0.5); C.shards(p.x, p.y, 40); GL.World.shake = 14; GL.World.flash = 0.25;
      });
    } else if (ch.id === 'baren') {
      GL.World.buffs.barrier = s.dur;
      C.ring(p.x, p.y, 120, '#e0b54a', 0.6);
    } else if (ch.id === 'kay') {
      p.lock = 0.8; p.iframe = 0.8;
      for (let i = 0; i < s.hits; i++) {
        this.later(0.1 * i, () => {
          const shape = { kind: 'circle', x: p.x, y: p.y, r: s.radius };
          C.hitArea(shape, ch, s.coef / s.hits, s.frac / s.hits, { shatter: true, skill: true });
          C.slash(p.x, p.y, Math.random() * 6.28, s.radius * 0.8, GL.U.deg(70), '#e6d6ff', 0.15);
        });
      }
      GL.World.shake = 8;
    }
  },

  // ---------- 태그 (숫자키 짧게) ----------
  tag(idx) {
    const p = this.player, C = GL.Combat;
    if (idx === this.activeIdx || !this.members[idx]) return;
    const m = this.members[idx];
    if (m.hp <= 0) { C.text(p.x, p.y - 30, `${m.name} 전투 불능`, '#9fb3c8', 13); return; }
    if (this.tagCd > 0) return;
    this.activeIdx = idx; this.tagCd = GL.CONFIG.rules.tagCooldown;
    p.lock = 0; p.guard = 0; p.buffer = null; p.iframe = Math.max(p.iframe, 0.2);
    C.ring(p.x, p.y, 50, m.color, 0.3);
    C.text(p.x, p.y - 40, m.name, m.color, 16);
  },

  // ---------- 조력 스킬 (숫자키 0.5초 홀딩) ----------
  assist(idx) {
    const p = this.player, C = GL.Combat, W = GL.World;
    const m = this.members[idx];
    if (!m) return;
    if (idx === this.activeIdx) { C.text(p.x, p.y - 30, '조력은 대기 중인 파티원만', '#9fb3c8', 13); return; }
    if (m.hp <= 0) return;
    if (m.cd.assist > 0) { C.text(p.x, p.y - 30, `${m.name} 조력 ${m.cd.assist.toFixed(1)}초`, '#9fb3c8', 13); return; }
    const a = m.cfg.assist;
    m.cd.assist = GL.CONFIG.rules.assistCooldown;
    C.text(p.x, p.y - 60, `${m.name} 조력 : ${a.name}`, m.color, 16);
    C.ring(p.x, p.y, 90, m.color, 0.45);
    if (m.id === 'ian') { W.buffs.shield = Math.round(this.active().maxHp * a.shieldRatio); W.buffs.shieldT = a.dur; }
    if (m.id === 'baren') W.buffs.fortress = a.dur;
    if (m.id === 'kay') { W.buffs.weakAll = a.dur; W.buffs.defDown = a.defDown; }
  },

  onActiveDown() {
    const p = this.player;
    GL.Combat.text(p.x, p.y - 50, `${this.active().name} 전투 불능`, '#ff5a6e', 18);
    const next = this.members.findIndex(m => m.hp > 0);
    if (next < 0) { GL.Main.gameOver(); return; }
    this.activeIdx = next; this.tagCd = 0; p.iframe = 1.0; p.lock = 0; p.guard = 0;
  },

  healActive(ratio) {
    const ch = this.active();
    const v = Math.round(ch.maxHp * ratio);
    ch.hp = Math.min(ch.maxHp, ch.hp + v);
    GL.Combat.text(this.player.x, this.player.y - 36, `+${v}`, '#3fe0a8', 16);
  },
};

</script>
<script>
// ===== js/enemies.js =====
// ============================================================
// enemies.js — 일반 · 엘리트 적과 각자의 관측/파쇄 기믹
// ============================================================
GL.Enemy = class {
  constructor(type, x, y, cfg) {
    const c = cfg || GL.CONFIG.enemies[type];
    this.type = type; this.cfg = c; this.name = c.name;
    this.x = x; this.y = y; this.r = c.r; this.color = c.color;
    this.maxHp = c.hp; this.hp = c.hp; this.atk = c.atk; this.def = c.def;
    this.fracMax = c.frac; this.frac = c.frac; this.speed = c.speed;
    this.groggy = 0; this.stun = 0; this.markWeak = 0; this.hitFlash = 0;
    this.bleedT = 0; this.defDownT = 0; this.defDown = 0;
    this.facing = 0; this.cd = GL.U.rand(0.8, 1.6); this.dead = false;
    this.elite = !!c.elite; this.boss = false; this.counted = true;
  }
  weakExposed() { return false; }
  player() { return GL.Party.player; }
  distP() { return GL.U.dist(this, this.player()); }
  angP() { return GL.U.angleTo(this, this.player()); }

  startGroggy() {
    this.groggy = GL.CONFIG.rules.groggyTime;
    GL.Combat.text(this.x, this.y - this.r - 24, '그로기!', '#ffe066', 22);
    GL.Combat.shards(this.x, this.y, 18);
    GL.World.shake = Math.max(GL.World.shake, 6);
    if (this.onGroggy) this.onGroggy();
  }

  update(dt) {
    this.hitFlash = Math.max(0, this.hitFlash - dt);
    if (this.markWeak > 0) this.markWeak -= dt;
    if (this.defDownT > 0) this.defDownT -= dt;
    if (this.bleedT > 0) {
      this.bleedT -= dt; this.bleedAcc = (this.bleedAcc || 0) + this.bleedDps * dt;
      if (this.bleedAcc >= 10) { const v = Math.round(this.bleedAcc); this.bleedAcc = 0; this.hp -= v; GL.Combat.text(this.x, this.y - this.r, `${v}`, '#ff6b9a', 12); if (this.hp <= 0) this.die(); }
    }
    if (this.groggy > 0) {
      this.groggy -= dt;
      if (this.groggy <= 0) this.endGroggy();
      return;
    }
    if (this.stun > 0) { this.stun -= dt; return; }
    this.think(dt);
  }

  endGroggy() {
    this.groggy = 0; this.frac = this.fracMax;
    // 일어서며 밀쳐내기 충격파
    const p = this.player(), d = this.distP();
    if (d < this.r + 90) {
      const a = this.angP();
      p.x += Math.cos(a) * 60; p.y += Math.sin(a) * 60;
    }
    GL.Combat.ring(this.x, this.y, this.r + 90, '#ff3b5c', 0.3);
    if (this.onRecover) this.onRecover();
  }

  moveToward(tx, ty, sp, dt) {
    const a = Math.atan2(ty - this.y, tx - this.x);
    this.x += Math.cos(a) * sp * dt; this.y += Math.sin(a) * sp * dt;
  }

  die(noDrop) {
    if (this.dead) return;
    this.dead = true; this.hp = 0;
    GL.Combat.shards(this.x, this.y, 14);
    if (!noDrop && !this.boss && Math.random() < (this.elite ? 1 : 0.3)) {
      GL.World.pickups.push({ x: this.x, y: this.y, kind: 'heal', v: this.elite ? 0.4 : 0.2, t: 0 });
    }
    GL.Stage.onEnemyDeath(this);
  }

  // 공격이 정면에서 들어왔는지 (가드 판정용)
  fromFront(src) {
    const p = src || this.player();
    return Math.abs(GL.U.angDiff(this.facing, GL.U.angleTo(this, p))) < GL.U.deg(70);
  }
};

// ---------- ① 노이즈 파편체 : 자폭 직전 폭발 코어 노출 ----------
GL.Shard = class extends GL.Enemy {
  constructor(x, y) { super('shard', x, y); this.state = 'chase'; }
  weakExposed() { return this.state === 'charge'; }
  think(dt) {
    this.facing = this.angP();
    if (this.state === 'chase') {
      this.moveToward(this.player().x, this.player().y, this.speed, dt);
      if (this.distP() < 70) {
        this.state = 'charge';
        GL.Combat.telegraph({ kind: 'circle', x: this.x, y: this.y, r: this.cfg.blastR, warn: this.cfg.chargeTime, owner: this, follow: true,
          onFire: (t) => {
            if (GL.U.inCircle(t, t.r, { x: GL.Party.player.x, y: GL.Party.player.y, r: 14 })) GL.Combat.hurtPlayer(this.atk, this.cfg.blastCoef, { src: null, ground: true });
            GL.Combat.ring(this.x, this.y, t.r, '#ff3b5c', 0.4);
            this.die(true);
          } });
      }
    }
  }
  onHit(info, opts, weak) {
    if (this.state === 'charge' && weak && opts.shatter) {
      GL.Combat.text(this.x, this.y - 30, '코어 파쇄!', '#3fe0a8', 18);
      this.die();
    }
  }
};

// ---------- ② 데이터 침식자 : 원거리 투사체 (관측 시 궤적 표시, 파쇄로 베어 반사) ----------
GL.Eroder = class extends GL.Enemy {
  constructor(x, y) { super('eroder', x, y); }
  think(dt) {
    const d = this.distP(), c = this.cfg;
    this.facing = this.angP();
    if (d < c.range - 60) this.moveToward(this.x * 2 - this.player().x, this.y * 2 - this.player().y, this.speed, dt);
    else if (d > c.range + 40) this.moveToward(this.player().x, this.player().y, this.speed, dt);
    this.cd -= dt;
    if (this.cd <= 0) {
      this.cd = c.fireEvery;
      const a = this.facing;
      GL.World.eShots.push({ x: this.x, y: this.y, vx: Math.cos(a) * c.shotSpeed, vy: Math.sin(a) * c.shotSpeed, r: 8, life: 2.5, atk: this.atk, coef: c.shotCoef, src: this });
    }
    GL.Stage.clamp(this);
  }
};

// ---------- ④ 균열의 파쇄손 : 정면 가드 -70%, 결합선 파쇄 시 가드 해제 + 그로기 ----------
GL.Clasher = class extends GL.Enemy {
  constructor(x, y) { super('clasher', x, y); this.guardUp = true; }
  weakExposed() { return this.guardUp && this.groggy <= 0; }
  think(dt) {
    const turn = 1.6 * dt, want = this.angP();
    this.facing += GL.U.clamp(GL.U.angDiff(this.facing, want), -turn, turn);
    if (this.distP() > 80) this.moveToward(this.player().x, this.player().y, this.speed, dt);
    this.cd -= dt;
    if (this.cd <= 0 && this.distP() < 110) {
      this.cd = 3;
      GL.Combat.telegraph({ kind: 'arc', x: this.x, y: this.y, dir: this.facing, r: 100, arc: GL.U.deg(100), warn: 0.9, red: true, atk: this.atk, coef: this.cfg.slamCoef, owner: this, ground: true });
    }
  }
  onHit(info, opts, weak) {
    if (!this.guardUp || this.groggy > 0) return;
    if (!this.fromFront()) return;
    if (weak && opts.shatter) {
      this.guardUp = false;
      GL.Combat.text(this.x, this.y - 40, '결합선 파쇄!', '#3fe0a8', 18);
      this.frac = 0; this.startGroggy();
    } else info.dmgMul *= 1 - this.cfg.frontReduce;
  }
  onRecover() { this.guardUp = true; }
};

// ---------- 엘리트 : 아카이브 집행 수호자 : 정면 일반 타격 100% 차단 ----------
GL.Guardian = class extends GL.Enemy {
  constructor(x, y) { super('guardian', x, y); this.shieldUp = true; this.pattern = 0; }
  weakExposed() { return this.shieldUp && this.groggy <= 0; }
  think(dt) {
    const turn = 2.2 * dt, want = this.angP();
    this.facing += GL.U.clamp(GL.U.angDiff(this.facing, want), -turn, turn);
    if (this.distP() > 95) this.moveToward(this.player().x, this.player().y, this.speed, dt);
    this.cd -= dt;
    if (this.cd <= 0 && this.distP() < 170) {
      this.cd = 2.4;
      this.pattern = (this.pattern + 1) % 2;
      if (this.pattern === 0) {
        GL.Combat.telegraph({ kind: 'arc', x: this.x, y: this.y, dir: this.facing, r: 110, arc: GL.U.deg(130), warn: 0.7, red: true, atk: this.atk, coef: this.cfg.swingCoef, owner: this, follow: true, ground: true });
      } else {
        GL.Combat.telegraph({ kind: 'line', x: this.x, y: this.y, dir: this.facing, len: 180, w: 56, warn: 0.8, atk: this.atk, coef: this.cfg.bashCoef, owner: this, ground: true });
      }
    }
  }
  onHit(info, opts, weak) {
    if (!this.shieldUp || this.groggy > 0) return;
    if (weak && opts.shatter) {
      this.shieldUp = false;
      GL.Combat.text(this.x, this.y - 44, '보호막 결합부 파쇄!', '#3fe0a8', 18);
      this.frac = 0; this.startGroggy();
      return;
    }
    if (this.fromFront()) info.blocked = true;
  }
  onRecover() { this.shieldUp = true; }
};

// ---------- 템푸스 2페이즈 : 시차 분신 (3초 전 본체 패턴 재현) ----------
GL.Echo = class extends GL.Enemy {
  constructor(x, y) { super('echo', x, y); this.life = GL.CONFIG.tempus.echoLife; this.counted = false; this.alpha = 0.6; }
  think(dt) {
    this.life -= dt;
    this.facing = this.angP();
    if (this.life <= 0) { GL.Combat.text(this.x, this.y - 30, '소멸', '#9a7bff', 13); this.die(true); }
  }
  replaySlash() {
    if (this.dead) return;
    const T = GL.CONFIG.tempus;
    GL.Combat.telegraph({ kind: 'arc', x: this.x, y: this.y, dir: this.angP(), r: T.slashR * 0.85, arc: GL.U.deg(T.slashArc), warn: 0.8, atk: GL.CONFIG.tempus.atk * T.echoCoef, coef: T.slashCoef, owner: this, ground: true });
  }
};

</script>
<script>
// ===== js/boss.js =====
// ============================================================
// boss.js — 인과 보스 1 : 템푸스 (시간의 찌꺼기)
// 1페이즈 시공간 참격 / 지연의 늪 / 약점 노출
// 2페이즈 시차 분신 / 시간 역류(HP 50%)
// 3페이즈 공간 붕괴 충격파 / 전멸기 시간의 톱니바퀴(HP 30%)
// ============================================================
GL.Boss = {
  knots: [],          // 관측 중에만 보이고 파쇄 속성으로만 끊을 수 있는 매듭
  current: null,

  hitKnots(shape, frac, ch) {
    if (!GL.World.observe.on || !this.knots.length) return;
    const R = GL.CONFIG.rules;
    for (const k of this.knots) {
      if (k.frac <= 0) continue;
      if (GL.Combat.inShape(shape, k)) {
        const v = frac * R.weakFracMul * (ch.id === 'ian' ? 1 + GL.CONFIG.chars.ian.passive.weakFracBonus : 1);
        k.frac = Math.max(0, k.frac - v);
        GL.Combat.shards(k.x, k.y, 8);
        GL.Combat.text(k.x, k.y - 26, k.frac <= 0 ? '매듭 절단!' : `-${Math.round(v)}`, '#3fe0a8', k.frac <= 0 ? 18 : 14);
      }
    }
  },
};

GL.Tempus = class extends GL.Enemy {
  constructor(x, y) {
    super('tempus', x, y, GL.CONFIG.tempus);
    this.boss = true; this.title = this.cfg.title;
    this.phase = 1; this.mode = 'idle';
    this.history = []; this.histT = 0;
    this.reversalDone = false; this.doomDone = false;
    this.echoTimer = 0; this.riftT = 2; this.cd = 2;
    this.timers = [];
    GL.Boss.current = this; GL.Boss.knots = [];
  }
  later(t, fn) { this.timers.push({ t, fn }); }
  weakExposed() { return this.mode === 'recover'; }
  hpRatio() { return this.hp / this.maxHp; }

  update(dt) {
    for (const t of this.timers) { t.t -= dt; if (t.t <= 0 && !t.done) { t.done = true; if (!this.dead) t.fn(); } }
    this.timers = this.timers.filter(t => !t.done);
    super.update(dt);
  }

  think(dt) {
    const T = this.cfg, W = GL.World;
    // 시간 역류용 기록 (0.25초 간격, 최근 6초)
    this.histT -= dt;
    if (this.histT <= 0) {
      this.histT = 0.25;
      this.history.push({ t: W.time, hp: this.hp, x: this.x, y: this.y });
      while (this.history.length && W.time - this.history[0].t > 6) this.history.shift();
    }

    // 페이즈 전환
    const hr = this.hpRatio();
    if (this.phase === 1 && hr <= T.phase2) { this.phase = 2; this.announce('2페이즈 : 인과 역류와 환영'); this.spawnEchoes(); }
    if (!this.reversalDone && hr <= T.reversalAt && this.mode !== 'doom') { this.startReversal(); }
    if (this.phase === 2 && hr <= T.phase3 && this.mode !== 'reversal') { this.phase = 3; this.announce('3페이즈 : 붕괴하는 궤적'); this.startDoom(); }

    if (this.mode === 'reversal') return this.updateReversal(dt);
    if (this.mode === 'doom') return this.updateDoom(dt);
    if (this.mode === 'recover') { this.recT -= dt; if (this.recT <= 0) this.mode = 'idle'; return; }

    // 2페이즈 이후 분신 재소환
    if (this.phase >= 2) {
      const alive = W.enemies.some(e => e instanceof GL.Echo && !e.dead);
      if (!alive) { this.echoTimer -= dt; if (this.echoTimer <= 0) this.spawnEchoes(); }
    }
    // 3페이즈 공간 붕괴 충격파
    if (this.phase >= 3) {
      this.riftT -= dt;
      if (this.riftT <= 0) { this.riftT = T.riftEvery; this.spawnRift(); }
    }

    // 이동
    this.facing = this.angP();
    if (this.distP() > 140) this.moveToward(this.player().x, this.player().y, this.speed, dt);
    GL.Stage.clamp(this);

    // 패턴 선택
    this.cd -= dt;
    if (this.cd <= 0) {
      this.cd = this.phase >= 3 ? 1.5 : 1.9;
      if (Math.random() < 0.6 || this.distP() < 200) this.slash();
      else this.swamp();
    }
  }

  announce(str) { GL.UI.banner(str); }

  // ---- 패턴 1 : 시공간 참격 (+1초 뒤 잔상 폭발) ----
  slash() {
    const T = this.cfg, dir = this.angP();
    const x = this.x, y = this.y;
    GL.Combat.telegraph({ kind: 'arc', x, y, dir, r: T.slashR, arc: GL.U.deg(T.slashArc), warn: 0.8, red: true, atk: this.atk, coef: T.slashCoef, owner: this, ground: true,
      onFire: (t) => {
        if (GL.Combat.inShape(t, { x: GL.Party.player.x, y: GL.Party.player.y, r: 14 })) GL.Combat.hurtPlayer(this.atk, T.slashCoef, { red: true, src: this, ground: true });
        GL.Combat.slash(x, y, dir, T.slashR, GL.U.deg(T.slashArc), '#d36bff', 0.3);
        // 잔상 : 같은 자리에 시차를 두고 다시 폭발
        GL.Combat.telegraph({ kind: 'arc', x, y, dir, r: T.slashR, arc: GL.U.deg(T.slashArc), warn: T.ghostDelay, ghost: true, atk: this.atk, coef: T.ghostCoef, owner: null, ground: true });
        // 큰 공격 후 약점 노출
        this.mode = 'recover'; this.recT = T.recover;
        // 2페이즈 : 분신이 3초 뒤 같은 패턴을 재현
        if (this.phase >= 2) this.later(T.echoDelay, () => GL.World.enemies.forEach(e => e instanceof GL.Echo && e.replaySlash()));
      } });
  }

  // ---- 패턴 2 : 지연의 늪 ----
  swamp() {
    const T = this.cfg, p = this.player();
    GL.Combat.telegraph({ kind: 'circle', x: p.x, y: p.y, r: T.swampR, warn: 0.6, atk: 0, coef: 0, owner: this,
      onFire: (t) => GL.World.fields.push({ kind: 'slow', x: t.x, y: t.y, r: T.swampR, life: T.swampTime, slow: T.swampSlow }) });
  }

  spawnEchoes() {
    const T = this.cfg;
    this.echoTimer = 20;
    for (let i = 0; i < T.echoCount; i++) {
      const a = this.angP() + (i === 0 ? 1.6 : -1.6);
      const e = new GL.Echo(this.x + Math.cos(a) * 180, this.y + Math.sin(a) * 180);
      GL.Stage.clamp(e);
      GL.World.enemies.push(e);
    }
    GL.Combat.text(this.x, this.y - 70, '시차 분신', '#9a7bff', 18);
  }

  spawnRift() {
    const T = this.cfg, b = GL.Stage.bounds, p = this.player();
    const near = Math.random() < 0.5;
    const x = near ? p.x + GL.U.rand(-80, 80) : GL.U.rand(b.x + 80, b.x + b.w - 80);
    const y = near ? p.y + GL.U.rand(-80, 80) : GL.U.rand(b.y + 80, b.y + b.h - 80);
    GL.World.fields.push({ kind: 'rift', x, y, r: T.riftR, life: T.riftLife + 1, arm: 1, armed: false, tick: 0, dps: T.riftDps });
  }

  // ---- 2페이즈 기믹 : 시간 역류 ----
  startReversal() {
    const T = this.cfg;
    this.reversalDone = true; this.mode = 'reversal'; this.castT = T.reversalCast;
    GL.World.tele = GL.World.tele.filter(t => t.owner !== this);
    // 지난 5초 동안의 이동 궤적 중앙에 인과 매듭이 생김
    const past = this.history[0] || { x: this.x, y: this.y };
    const mx = (past.x + this.x) / 2 + GL.U.rand(-60, 60), my = (past.y + this.y) / 2 + GL.U.rand(-60, 60);
    GL.Boss.knots = [{ x: mx, y: my, r: 24, frac: T.reversalKnotFrac, max: T.reversalKnotFrac, kind: 'reversal' }];
    if (!GL.World.observe.on) GL.World.observe.cd = 0;   // 기믹 시작 시 관측 쿨타임 초기화
    this.announce('시간 역류 캐스팅 — 관측(Tab)으로 인과 매듭을 찾아 파쇄하라');
  }
  updateReversal(dt) {
    const T = this.cfg;
    this.castT -= dt;
    if (GL.Boss.knots.every(k => k.frac <= 0)) {
      GL.Boss.knots = []; this.mode = 'idle';
      GL.UI.banner('시간 역류 저지!');
      this.frac = 0; this.startGroggy();
      return;
    }
    if (this.castT <= 0) {
      GL.Boss.knots = []; this.mode = 'idle';
      const target = this.history.find(h => GL.World.time - h.t <= T.reversalBack + 0.1) || this.history[0];
      if (target) { this.hp = Math.max(this.hp, target.hp); this.x = target.x; this.y = target.y; }
      GL.UI.banner('시간 역류 — 템푸스가 5초 전으로 되돌아갔다');
      GL.Combat.ring(this.x, this.y, 160, '#d36bff', 0.6);
    }
  }

  // ---- 3페이즈 전멸기 : 시간의 톱니바퀴 ----
  startDoom() {
    const T = this.cfg, b = GL.Stage.bounds;
    this.doomDone = true; this.mode = 'doom'; this.doomT = T.doomTime;
    GL.World.tele = GL.World.tele.filter(t => t.owner !== this);
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2, off = Math.random() * 6.28;
    GL.Boss.knots = [];
    for (let i = 0; i < T.doomKnots; i++) {
      const a = off + i * Math.PI * 2 / T.doomKnots;
      GL.Boss.knots.push({ x: cx + Math.cos(a) * 300, y: cy + Math.sin(a) * 230, r: 24, frac: T.doomKnotFrac, max: T.doomKnotFrac, kind: 'doom' });
    }
    this.x = cx; this.y = cy;
    if (!GL.World.observe.on) GL.World.observe.cd = 0;   // 기믹 시작 시 관측 쿨타임 초기화
    this.announce('[전멸기] 시간의 톱니바퀴 — 10초 안에 시간의 매듭 3개를 끊어라');
  }
  updateDoom(dt) {
    this.doomT -= dt;
    GL.World.mono = Math.min(1, GL.World.mono + dt * 2);
    if (GL.Boss.knots.every(k => k.frac <= 0)) {
      GL.Boss.knots = []; this.mode = 'idle'; GL.World.mono = 0;
      GL.UI.banner('전멸기 저지! 극딜 타임');
      this.frac = 0; this.startGroggy();
      return;
    }
    if (this.doomT <= 0) {
      GL.Boss.knots = []; this.mode = 'idle'; GL.World.mono = 0;
      GL.UI.banner('시간의 톱니바퀴 — 파티 전멸');
      for (const m of GL.Party.members) m.hp = 0;
      GL.Main.gameOver();
    }
  }

  die() {
    if (this.dead) return;
    this.dead = true; this.hp = 0;
    GL.Boss.knots = []; GL.World.mono = 0;
    GL.Combat.shards(this.x, this.y, 60);
    GL.World.shake = 16;
    GL.World.enemies.forEach(e => { if (e instanceof GL.Echo) e.die(true); });
    GL.Stage.onBossDefeated();
  }
};

</script>
<script>
// ===== js/stage.js =====
// ============================================================
// stage.js — 진행 흐름 : 필드 3웨이브 → 균열 포털 → 템푸스 보스전
// ============================================================
GL.Stage = {
  bounds: { x: 0, y: 0, w: 1800, h: 1300 },
  name: 'field',
  wave: 0,
  waveDelay: 0,
  portal: null,
  hint: '',

  WAVES: [
    { list: [['shard', 900, 450], ['shard', 1000, 800], ['shard', 1150, 600], ['eroder', 1400, 350], ['eroder', 1400, 950]],
      hint: '파편체가 멈춰서 깜빡이면 자폭 준비 — Tab(관측)을 켜고 4타·강공격(좌클릭 홀딩)·스킬로 폭발 코어를 파쇄하면 즉사' },
    { list: [['clasher', 1100, 500], ['clasher', 1100, 850], ['eroder', 1500, 400], ['shard', 900, 300], ['shard', 900, 1000]],
      hint: '파쇄손은 정면 피해 -70% — 관측 중 정면에서 파쇄 속성 공격을 넣으면 결합선이 끊겨 그로기' },
    { list: [['guardian', 1200, 650], ['shard', 1000, 400], ['shard', 1000, 900]],
      hint: '수호자는 정면 일반 타격을 막는다 — 관측 + 파쇄로 보호막 해제, 또는 바렌(2) 강공격 홀딩 = 퍼펙트 가드로 붉은 공격 반사' },
  ],

  start(name) {
    GL.World.reset();
    GL.Boss.knots = []; GL.Boss.current = null;
    this.name = name; this.portal = null;
    const p = GL.Party.player;
    GL.Render.yaw = 0; GL.Render.pitch = 0.38;
    p.facing = 0; p.z = 0; p.vz = 0; p.dash = null; p.plunge = null; p.lock = 0; p.guard = 0;
    if (name === 'field') {
      this.bounds = { x: 0, y: 0, w: 1800, h: 1300 };
      p.x = 300; p.y = 650;
      this.wave = 0; this.waveDelay = 1.2;
      GL.UI.banner('표면 현실 — 노이즈 반응 감지');
    } else {
      this.bounds = { x: 0, y: 0, w: 1300, h: 950 };
      p.x = 300; p.y = 475;
      const b = new GL.Tempus(950, 475);
      GL.World.enemies.push(b);
      this.hint = '인과 보스 템푸스 — 붉은 공격은 바렌 퍼펙트 가드로 반사 가능. 큰 참격 뒤 2초간 등의 시간의 핵이 노출된다(관측)';
      GL.UI.banner('인과 균열 토벌전 : 시간의 찌꺼기 템푸스');
    }
    GL.Render.tgt.x = p.x; GL.Render.tgt.y = p.y;
    if (GL.Render.buildProps) GL.Render.buildProps();
  },

  update(dt) {
    if (this.name === 'field' && this.waveDelay > 0) {
      this.waveDelay -= dt;
      if (this.waveDelay <= 0) this.spawnWave();
    }
    for (const k of GL.World.pickups) k.t += dt;
  },

  spawnWave() {
    const w = this.WAVES[this.wave];
    if (!w) return;
    for (const [type, x, y] of w.list) {
      const cls = { shard: GL.Shard, eroder: GL.Eroder, clasher: GL.Clasher, guardian: GL.Guardian }[type];
      GL.World.enemies.push(new cls(x, y));
    }
    this.hint = w.hint;
    GL.UI.banner(`웨이브 ${this.wave + 1} / ${this.WAVES.length}`);
  },

  onEnemyDeath(e) {
    if (!e.counted || this.name !== 'field') return;
    const alive = GL.World.enemies.some(x => !x.dead && x.counted);
    if (alive) return;
    this.wave++;
    if (this.wave < this.WAVES.length) { this.waveDelay = 1.5; }
    else {
      this.portal = { x: 1550, y: 650, r: 40 };
      this.hint = '필드 정리 완료 — 인과 균열(포털)로 가서 F로 진입';
      GL.UI.banner('인과 균열 발생');
    }
  },

  onBossDefeated() { GL.Main.win(); },

  // F : 상호작용 (회복 데이터 줍기 / 포털 진입)
  interact() {
    const p = GL.Party.player, W = GL.World;
    for (const k of W.pickups) {
      if (!k.taken && GL.U.dist(p, k) < 60) { k.taken = true; GL.Party.healActive(k.v); W.pickups = W.pickups.filter(x => !x.taken); return; }
    }
    if (this.portal && GL.U.dist(p, this.portal) < 90) { this.start('boss'); return; }
  },
  nearInteractable() {
    const p = GL.Party.player;
    if (GL.World.pickups.some(k => GL.U.dist(p, k) < 60)) return '회복 데이터 줍기';
    if (this.portal && GL.U.dist(p, this.portal) < 90) return '인과 균열 진입';
    return null;
  },

  clamp(o) {
    const b = this.bounds, r = o.r || 14;
    o.x = GL.U.clamp(o.x, b.x + r, b.x + b.w - r);
    o.y = GL.U.clamp(o.y, b.y + r, b.y + b.h - r);
  },
};

</script>
<script>
// ===== js/master.js =====
// ============================================================
// master.js — 마스터 모드 (테스트 모드)
//   PC     : ` (숫자 1 왼쪽 키) = 진입 / 나가기,  H = 패널 열기 / 숨기기 (옵션 유지)
//   휴대폰 : 세 손가락으로 탭 = 진입 / 나가기,  화면 위 MASTER 표시 탭 = 패널 열기
// 패널이 열려 있는 동안 게임은 멈춘다. 나가면 모든 테스트 옵션이 꺼진다.
// ============================================================
GL.Master = {
  active: false,
  panel: false,
  speed: 1,
  shapes: [],           // 판정 범위 표시용 (최근 공격 범위)
  opt: { god: false, noCd: false, fullUlt: false, oneShot: false, freeze: false, infObs: false, hitbox: false, info: true },
  buttons: [],
  fps: 60, _fpsAcc: 0, _fpsN: 0,

  TOGGLES: [
    ['god', '무적'], ['noCd', '쿨타임 없음'], ['fullUlt', '궁극기 항상 가득'], ['oneShot', '원샷 (피해 x100)'],
    ['freeze', '적 정지'], ['infObs', '관측 무한'], ['hitbox', '판정 범위 표시'], ['info', '정보 표시'],
  ],
  ACTIONS: [
    ['heal', '파티 전원 회복'], ['killAll', '일반 적 전부 처치'], ['speed', '게임 속도'],
    ['wave1', '필드 웨이브 1'], ['wave2', '필드 웨이브 2'], ['wave3', '필드 웨이브 3 (엘리트)'],
    ['boss', '보스전 처음부터'], ['phase2', '보스 2페이즈 (70%)'], ['reversal', '시간 역류 (50%)'],
    ['doom', '3페이즈 · 전멸기 (30%)'], ['groggy', '보스 그로기'], ['portal', '포털 열기'],
    ['spawn:shard', '파편체 소환'], ['spawn:eroder', '침식자 소환'], ['spawn:clasher', '파쇄손 소환'],
    ['spawn:guardian', '수호자 소환'],
  ],

  // ---------- 진입 / 나가기 ----------
  toggle() {
    const M = GL.Main;
    if (!['play', 'pause', 'master'].includes(M.state)) return;
    if (!this.active) {
      this.active = true; this.openPanel();
      GL.UI.banner('마스터 모드 진입');
    } else {
      this.active = false; this.panel = false; this.speed = 1; this.shapes = [];
      for (const k in this.opt) this.opt[k] = k === 'info';
      if (M.state === 'master') M.state = 'play';
      GL.UI.banner('마스터 모드 종료 — 테스트 옵션 모두 꺼짐');
    }
  },
  togglePanel() {
    if (!this.active) return;
    if (this.panel) this.closePanel(); else this.openPanel();
  },
  openPanel() {
    this.panel = true;
    if (GL.Main.state === 'play' || GL.Main.state === 'pause') GL.Main.state = 'master';
    GL.Input.unlock();
  },
  closePanel() {
    this.panel = false;
    if (GL.Main.state === 'master') GL.Main.state = 'play';
  },

  // ---------- 매 프레임 적용 ----------
  update(dt) {
    this._fpsAcc += dt; this._fpsN++;
    if (this._fpsAcc >= 0.5) { this.fps = Math.round(this._fpsN / this._fpsAcc); this._fpsAcc = 0; this._fpsN = 0; }
    if (!this.active) return;
    const P = GL.Party, W = GL.World, O = this.opt;
    if (O.noCd) {
      for (const m of P.members) { m.cd.q = 0; m.cd.e = 0; m.cd.assist = 0; }
      P.tagCd = 0; P.player.dodgeCharges = GL.CONFIG.rules.dodgeCharges;
      if (!W.observe.on) W.observe.cd = 0;
    }
    if (O.fullUlt) for (const m of P.members) m.ult = m.ultMax;
    if (O.infObs && W.observe.on) W.observe.t = GL.CONFIG.rules.observeDuration;
    for (const s of this.shapes) s.life -= dt;
    this.shapes = this.shapes.filter(s => s.life > 0);
  },
  dmgMul() { return this.active && this.opt.oneShot ? 100 : 1; },
  god() { return this.active && this.opt.god; },
  frozen() { return this.active && this.opt.freeze; },
  timeScale() { return this.active ? this.speed : 1; },
  recordShape(s) { if (this.active && this.opt.hitbox) this.shapes.push({ ...s, life: 0.4 }); },

  // ---------- 동작 ----------
  run(id) {
    const S = GL.Stage, W = GL.World, P = GL.Party;
    const boss = () => { if (S.name !== 'boss' || !GL.Boss.current || GL.Boss.current.dead) S.start('boss'); return GL.Boss.current; };
    if (id === 'speed') { this.speed = this.speed === 1 ? 2 : (this.speed === 2 ? 0.5 : 1); return; }
    if (id === 'heal') {
      for (const m of P.members) m.hp = m.maxHp;
      GL.Combat.text(P.player.x, P.player.y - 40, '전원 회복', '#3fe0a8', 16);
    } else if (id === 'killAll') {
      for (const e of W.enemies) if (!e.dead && !e.boss) e.die(true);
    } else if (id.startsWith('wave')) {
      const n = parseInt(id.slice(4), 10);
      S.start('field'); S.wave = n - 1; S.waveDelay = 0.05;
    } else if (id === 'boss') {
      S.start('boss');
    } else if (id === 'phase2') {
      const b = boss(); b.hp = b.maxHp * 0.69;
    } else if (id === 'reversal') {
      const b = boss(); b.phase = 2; b.reversalDone = false; b.hp = b.maxHp * 0.49;
    } else if (id === 'doom') {
      const b = boss(); b.phase = 2; b.reversalDone = true; b.mode = 'idle'; GL.Boss.knots = []; b.hp = b.maxHp * 0.29;
    } else if (id === 'groggy') {
      const b = boss(); b.frac = 0; b.startGroggy();
    } else if (id === 'portal') {
      if (S.name !== 'field') S.start('field');
      for (const e of W.enemies) if (!e.dead) e.die(true);
      S.wave = S.WAVES.length; S.waveDelay = 0;
      S.portal = { x: 1550, y: 650, r: 40 }; S.hint = '포털이 열렸다 — F로 진입';
    } else if (id.startsWith('spawn:')) {
      const type = id.slice(6), cls = { shard: GL.Shard, eroder: GL.Eroder, clasher: GL.Clasher, guardian: GL.Guardian }[type];
      const f = GL.Render.forward(), p = P.player;
      const e = new cls(p.x + f.x * 180, p.y + f.y * 180); e.counted = false; S.clamp(e);
      W.enemies.push(e);
    }
    // 장면이 바뀌는 동작은 패널을 닫고 바로 보여줌
    if (id !== 'heal') this.closePanel();
  },

  // ---------- 그리기 ----------
  layout(cv) {
    const touch = GL.Touch.enabled;
    const cols = 3, bw = Math.min(touch ? 168 : 200, (cv.width - 60) / cols), bh = touch ? 26 : 30, gap = 6;
    const rows = Math.ceil(this.TOGGLES.length / cols) + Math.ceil(this.ACTIONS.length / cols) + 1;
    const W = cols * bw + (cols - 1) * gap, H = 44 + rows * (bh + gap) + 22;
    const x0 = (cv.width - W) / 2, y0 = Math.max(6, (cv.height - H) / 2);
    const list = [];
    let y = y0 + 40;
    const place = (items, kind) => {
      items.forEach(([id, label], i) => {
        const c = i % cols, r = Math.floor(i / cols);
        list.push({ id, label, kind, x: x0 + c * (bw + gap), y: y + r * (bh + gap), w: bw, h: bh });
      });
      y += Math.ceil(items.length / cols) * (bh + gap) + 8;
    };
    place(this.TOGGLES, 'toggle');
    place(this.ACTIONS, 'action');
    place([['hide', 'H  패널 숨기기 (옵션 유지)'], ['exit', '`  마스터 모드 나가기'], ['close', '닫고 계속하기']], 'sys');
    this.box = { x: x0 - 14, y: y0, w: W + 28, h: y - y0 + 2 };
    this.buttons = list;
    return list;
  },

  click(x, y) {
    if (!this.panel) return false;
    for (const b of this.buttons) {
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        if (b.kind === 'toggle') this.opt[b.id] = !this.opt[b.id];
        else if (b.id === 'hide' || b.id === 'close') this.closePanel();
        else if (b.id === 'exit') this.toggle();
        else this.run(b.id);
        return true;
      }
    }
    return false;
  },

  badgeHit(x, y) { const r = this.badgeRect; return this.active && !this.panel && r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; },

  draw(ctx, cv) {
    if (!this.active) return;
    const touch = GL.Touch.enabled;
    ctx.save();
    // MASTER 표시 (패널 닫혀 있을 때)
    const on = Object.entries(this.opt).filter(([k, v]) => v && k !== 'info').map(([k]) => this.TOGGLES.find(t => t[0] === k)[1]);
    if (this.speed !== 1) on.push(`속도 x${this.speed}`);
    const label = `MASTER ${on.length ? '· ' + on.join(' · ') : ''}`;
    ctx.font = 'bold 12px sans-serif';
    const bw = Math.min(cv.width * 0.5, ctx.measureText(label).width + 20);
    const bx = cv.width / 2 - bw / 2, by = cv.height - (touch ? 30 : 128);
    this.badgeRect = { x: bx, y: by, w: bw, h: 22 };
    ctx.fillStyle = 'rgba(255,60,90,0.85)'; ctx.fillRect(bx, by, bw, 22);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    let lab = label; while (ctx.measureText(lab).width > bw - 12 && lab.length > 8) lab = lab.slice(0, -2);
    ctx.fillText(lab === label ? label : lab + '…', cv.width / 2, by + 15);
    // 정보 표시
    if (this.opt.info) {
      const p = GL.Party.player, b = GL.Boss.current;
      const lines = [
        `FPS ${this.fps}   속도 x${this.speed}`,
        `위치 ${Math.round(p.x)}, ${Math.round(p.y)}  높이 ${Math.round(p.z)}`,
        `스테이지 ${GL.Stage.name}  웨이브 ${GL.Stage.wave + 1}  적 ${GL.World.enemies.filter(e => !e.dead).length}`,
        b && !b.dead ? `템푸스 HP ${(b.hp / b.maxHp * 100).toFixed(1)}%  ${b.phase}페이즈  ${b.mode}  파쇄 ${Math.ceil(b.frac)}` : '보스 없음',
        `관측 ${GL.World.observe.on ? '켜짐 ' + GL.World.observe.t.toFixed(1) : '쿨 ' + GL.World.observe.cd.toFixed(1)}`,
      ];
      const x = touch ? cv.width - 210 : cv.width - 230, y = touch ? 56 : 210;
      ctx.fillStyle = 'rgba(40,0,10,0.7)'; ctx.fillRect(x, y, touch ? 200 : 216, lines.length * 15 + 10);
      ctx.fillStyle = '#ffd0d8'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
      lines.forEach((l, i) => ctx.fillText(l, x + 8, y + 17 + i * 15));
    }
    if (!this.panel) { ctx.restore(); return; }
    // 패널
    this.layout(cv);
    const B = this.box;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = 'rgba(14,6,14,0.94)'; ctx.fillRect(B.x, B.y, B.w, B.h);
    ctx.strokeStyle = '#ff3b5c'; ctx.lineWidth = 2; ctx.strokeRect(B.x, B.y, B.w, B.h);
    ctx.textAlign = 'left'; ctx.fillStyle = '#ff3b5c'; ctx.font = `bold ${touch ? 15 : 18}px sans-serif`;
    ctx.fillText('MASTER MODE · 테스트 모드', B.x + 14, B.y + 26);
    ctx.textAlign = 'right'; ctx.fillStyle = '#c9a0aa'; ctx.font = '11px sans-serif';
    ctx.fillText(touch ? '세 손가락 탭 = 나가기  ·  MASTER 표시 탭 = 패널' : '` = 나가기  ·  H = 패널 숨기기  ·  게임 일시정지 중', B.x + B.w - 14, B.y + 26);
    for (const b of this.buttons) {
      const on = b.kind === 'toggle' && this.opt[b.id];
      ctx.fillStyle = on ? 'rgba(255,60,90,0.85)' : (b.kind === 'sys' ? 'rgba(60,40,60,0.9)' : 'rgba(40,28,44,0.9)');
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = on ? '#ffd0d8' : 'rgba(255,120,150,0.35)'; ctx.lineWidth = 1; ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.font = `${touch ? 11 : 13}px sans-serif`;
      let text = b.label;
      if (b.kind === 'toggle') text = `${on ? '■' : '□'}  ${b.label}`;
      if (b.id === 'speed') text = `게임 속도 x${this.speed}`;
      ctx.fillText(text, b.x + b.w / 2, b.y + b.h / 2 + 4);
    }
    ctx.restore();
  },
};
