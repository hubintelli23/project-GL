<script>
// ===== js/assets/characters.js =====
// ============================================================
// assets/characters.js — 아바타 캐릭터 (플레이어 파티)
// 관절이 있는 인형 : 골반 → 허벅지 → 정강이 / 몸통 → 위팔 → 아래팔 → 손 → 무기
// 나중에 실제 아바타 모델로 바꿀 때는 defs 의 외형 값을 쓰는 draw() 를 교체하면 된다.
// 자세(pose)는 GL.Party.player.anim / walk / z 에서 계산 → 실제 모델의 애니메이션 이름과 맞춰 쓰면 됨
// ============================================================
GL.Assets = GL.Assets || {};

GL.Assets.Characters = {
  // ---------- 외형 정의 (색·체격·머리 모양·무기) ----------
  defs: {
    ian: {
      scale: 1.0, shoulder: 9, build: 1.0,
      skin: '#f1dfcf', hair: '#d8e6f2', hairStyle: 'spiky',
      coat: '#2e3f58', coatTrim: '#3fe0a8', shirt: '#e8eef5', pants: '#2c3646', boots: '#11161f',
      scarf: '#3fe0a8', coatLength: 'long', weapon: 'ian', dual: true, eye: '#3fe0a8',
    },
    baren: {
      scale: 1.12, shoulder: 11, build: 1.25,
      skin: '#d9b896', hair: '#4a3420', hairStyle: 'short',
      coat: '#5a4220', coatTrim: '#e0b54a', shirt: '#3a2c14', pants: '#2c2418', boots: '#1a140c',
      armor: '#b38b3a', coatLength: 'short', weapon: 'baren', shieldArm: true, eye: '#ffe066',
    },
    kay: {
      scale: 0.96, shoulder: 8, build: 0.9,
      skin: '#efd9cb', hair: '#2a1e3d', hairStyle: 'hood',
      coat: '#3a2a55', coatTrim: '#b48cff', shirt: '#4b3a6a', pants: '#2a1f3a', boots: '#120c1a',
      scarf: '#b48cff', coatLength: 'cape', weapon: 'kay', dual: true, eye: '#ff6b9a',
    },
  },

  c(hex, a = 1) { return GL.G3.rgba(hex, a); },
  cloth: { spec: 0.05, shine: 8, rim: 0.3 },
  skinM: { spec: 0.15, shine: 14, rim: 0.25 },

  // ---------- 자세 계산 ----------
  pose(p, def, t) {
    const a = p.anim || { kind: 'idle', t: 0, dur: 1 }, u = Math.min(1, a.t / (a.dur || 1));
    const P = {
      lean: 0, twist: 0, crouch: 0, head: 0,
      L: { hip: 0, knee: 0.08 }, R: { hip: 0, knee: 0.08 },
      aL: { pitch: 0.15, yaw: 0, roll: 0.18, elbow: 0.35 }, aR: { pitch: 0.15, yaw: 0, roll: -0.18, elbow: 0.35 },
      glow: 0, shield: 0, coatSwing: 0,
    };
    const breath = Math.sin(t * 2.2) * 0.03;
    P.aL.roll += breath; P.aR.roll -= breath;
    // 달리기
    if (p.moving && p.z < 1) {
      const ph = p.walk, s = Math.sin(ph), c = Math.cos(ph);
      P.L.hip = s * 0.85; P.R.hip = -s * 0.85;
      P.L.knee = 0.2 + Math.max(0, -c) * 1.1; P.R.knee = 0.2 + Math.max(0, c) * 1.1;
      P.aL.pitch = -s * 0.7; P.aR.pitch = s * 0.7; P.aL.elbow = P.aR.elbow = 0.9;
      P.lean = 0.22; P.crouch = Math.abs(c) * 1.5; P.coatSwing = 0.35 + Math.abs(s) * 0.2;
    }
    // 공중
    if (p.z > 1) {
      P.L.hip = 0.7; P.R.hip = 0.3; P.L.knee = 1.3; P.R.knee = 0.9;
      P.aL.pitch = P.aR.pitch = 0.6; P.aL.roll = 0.6; P.aR.roll = -0.6; P.coatSwing = 0.5;
    }
    const swing = (side, from, to) => {
      const arm = side === 'R' ? P.aR : P.aL, k = Math.sin(Math.min(1, u * 1.4) * Math.PI / 2);
      arm.pitch = 1.45; arm.elbow = 0.25; arm.yaw = (side === 'R' ? 1 : -1) * (from + (to - from) * k); arm.roll = 0;
      P.twist = (side === 'R' ? -1 : 1) * (from + (to - from) * k) * 0.35;
    };
    switch (a.kind) {
      case 'light': {
        const st = a.step || 1;
        if (st === 1) swing('R', -1.2, 1.3);
        else if (st === 2) swing('L', -1.2, 1.3);
        else if (st === 3) { P.aR.pitch = 1.55; P.aR.elbow = 0.05; P.aR.yaw = 0; P.lean = 0.35; P.L.hip = 0.6; P.R.hip = -0.4; }
        else { swing('R', -1.4, 1.4); swing('L', -1.4, 1.4); P.twist = 0; P.crouch = 3; P.glow = 1; }
        P.lean = Math.max(P.lean, 0.2); P.glow = Math.max(P.glow, 0.5);
        break;
      }
      case 'heavy': {
        const up = u < 0.35, k = up ? u / 0.35 : (u - 0.35) / 0.65;
        const pitch = up ? 1.4 + k * 1.5 : 2.9 - Math.min(1, k * 2) * 1.8;
        P.aL.pitch = P.aR.pitch = pitch; P.aL.elbow = P.aR.elbow = 0.2; P.aL.yaw = -0.25; P.aR.yaw = 0.25; P.aL.roll = P.aR.roll = 0;
        P.lean = up ? -0.1 : 0.45; P.crouch = up ? 0 : 5; P.L.hip = 0.6; P.R.hip = -0.5; P.R.knee = 0.6; P.glow = 1;
        break;
      }
      case 'guard': {
        P.aL.pitch = 1.3; P.aL.elbow = 1.1; P.aL.yaw = -0.4; P.aL.roll = 0; P.shield = 1;
        P.aR.pitch = 0.9; P.aR.elbow = 1.2; P.crouch = 5; P.lean = 0.15; P.L.hip = 0.5; P.R.hip = -0.4; P.L.knee = P.R.knee = 0.6;
        P.glow = 1;
        break;
      }
      case 'skillQ': case 'skillE': {
        P.aR.pitch = 1.5; P.aR.elbow = 0.1; P.aR.yaw = 0.1; P.aL.pitch = 1.2; P.aL.yaw = -0.6; P.aL.elbow = 0.4;
        P.lean = 0.4; P.L.hip = 0.7; P.R.hip = -0.6; P.R.knee = 0.4; P.glow = 1; P.coatSwing = 0.7;
        break;
      }
      case 'ult': {
        const k = Math.min(1, u * 2);
        P.aL.pitch = P.aR.pitch = 2.9 - k * 1.3; P.aL.roll = 0.8 * k; P.aR.roll = -0.8 * k; P.aL.elbow = P.aR.elbow = 0.1;
        P.crouch = 6 * k; P.lean = -0.1 + 0.3 * k; P.glow = 1; P.coatSwing = 0.8;
        break;
      }
      case 'plunge': {
        P.aL.pitch = P.aR.pitch = 2.6; P.aL.elbow = P.aR.elbow = 0.2; P.lean = 0.5; P.L.knee = P.R.knee = 1.4; P.L.hip = P.R.hip = 1.0; P.glow = 1;
        break;
      }
      case 'land': {
        const k = 1 - u;
        P.crouch = 9 * k; P.L.hip = P.R.hip = 0.9 * k; P.L.knee = P.R.knee = 1.6 * k; P.aL.pitch = P.aR.pitch = 1.0; P.lean = 0.5 * k;
        break;
      }
      case 'dodge': {
        P.crouch = 7; P.lean = 0.7; P.L.hip = 1.1; P.R.hip = -0.2; P.L.knee = 1.4; P.R.knee = 0.9; P.aL.pitch = P.aR.pitch = -0.6; P.coatSwing = 0.9;
        break;
      }
    }
    if (def.shieldArm && a.kind !== 'guard') P.aL.pitch = Math.max(P.aL.pitch, 0.35);
    return P;
  },

  // ---------- 그리기 ----------
  drawPlayer(G) {
    const p = GL.Party.player, ch = GL.Party.active(), t = GL.World.time;
    if (!ch) return;
    const def = this.defs[ch.id] || this.defs.ian;
    const P = this.pose(p, def, t);
    const flash = p.hurtFlash > 0, alpha = p.iframe > 0 ? 0.55 : 1;
    this.humanoid(G, def, P, p.x, p.z * 0.6, p.y, p.facing, { flash, alpha, t, observe: GL.World.observe.on });
  },

  humanoid(G, def, P, x, h, y, facing, o) {
    const s = def.scale, b = def.build, C = (hex) => this.c(o.flash ? '#ffffff' : hex, o.alpha);
    const hipY = 24 * s - P.crouch, thigh = 12 * s, shin = 12 * s, torso = 20 * s, upper = 10 * s, fore = 10 * s, sh = def.shoulder * s;
    const R0 = G.root(x, h, y, facing);

    // --- 다리 ---
    for (const [side, z] of [['L', -4.6 * s * b], ['R', 4.6 * s * b]]) {
      const L = P[side];
      const Mh = G.chain(R0, G.T(0, hipY, z), G.Rz(L.hip));
      G.draw('tube', G.chain(Mh, G.T(0, -thigh, 0), G.S(3.1 * b, thigh, 3.1 * b)), C(def.pants), 0, this.cloth);
      const Mk = G.chain(Mh, G.T(0, -thigh, 0), G.Rz(-L.knee));
      G.draw('ball', G.chain(Mk, G.S(3 * b, 3 * b, 3 * b)), C(def.pants), 0, this.cloth);
      G.draw('tube', G.chain(Mk, G.T(0, -shin, 0), G.S(2.7 * b, shin, 2.7 * b)), C(def.boots), 0, { spec: 0.3, shine: 20, rim: 0.3 });
      G.draw('box', G.chain(Mk, G.T(2.2, -shin - 1.2, 0), G.S(8.5 * b, 3.4, 5 * b)), C(def.boots), 0, { spec: 0.4, shine: 24 });
      if (def.armor) G.draw('box', G.chain(Mk, G.T(2.4, -shin * 0.45, 0), G.S(2, shin * 0.7, 4.6)), C(def.armor), 0.05, { spec: 0.8, shine: 40, rim: 0.4 });
    }

    // --- 몸통 ---
    const Mt = G.chain(R0, G.T(0, hipY, 0), G.Rz(-P.lean), G.Ry(P.twist));
    G.draw('box', G.chain(Mt, G.T(0, 1, 0), G.S(9 * b, 6, 12 * b)), C(def.pants), 0, this.cloth);                 // 골반
    G.draw('wedge', G.chain(Mt, G.T(0, torso * 0.55, 0), G.Rz(Math.PI), G.S(10 * b, torso * 0.95, 17 * b)), C(def.coat), 0, this.cloth); // 가슴(역삼각)
    G.draw('box', G.chain(Mt, G.T(5 * b, torso * 0.6, 0), G.S(1, torso * 0.7, 5)), C(def.shirt), 0, this.cloth);   // 셔츠 앞
    G.draw('box', G.chain(Mt, G.T(0, 4, 0), G.S(10 * b, 2.6, 13 * b)), C(def.coatTrim), 0.25, { spec: 0.6, shine: 30 }); // 벨트
    // 코트 자락 / 망토
    const sw = P.coatSwing;
    if (def.coatLength === 'long') {
      for (const z of [-4.5 * b, 4.5 * b]) G.draw('wedge', G.chain(Mt, G.T(-3, 2, z), G.Rz(-0.15 - sw), G.T(0, -9, 0), G.S(4, 18, 6)), C(def.coat), 0, this.cloth);
      G.draw('box', G.chain(Mt, G.T(-4.5, 2, 0), G.Rz(-0.1 - sw), G.T(0, -8.5, 0), G.S(1.2, 17, 1.4)), C(def.coatTrim), 0.6);
    } else if (def.coatLength === 'cape') {
      G.draw('wedge', G.chain(Mt, G.T(-5, torso, 0), G.Rz(-0.08 - sw * 0.8), G.T(0, -15, 0), G.S(2, 30, 17)), C(def.coat), 0, this.cloth);
    } else {
      G.draw('wedge', G.chain(Mt, G.T(-2, 2, 0), G.Rz(-0.1 - sw * 0.5), G.T(0, -5, 0), G.S(6, 10, 13 * b)), C(def.coat), 0, this.cloth);
    }
    if (def.armor) { // 가슴 장갑
      G.draw('box', G.chain(Mt, G.T(5.5 * b, torso * 0.68, 0), G.S(2.2, torso * 0.5, 13 * b)), C(def.armor), 0.05, { spec: 0.8, shine: 40, rim: 0.4 });
    }
    if (def.scarf) { // 목도리 (뒤로 날림)
      G.draw('tube', G.chain(Mt, G.T(0, torso + 0.5, 0), G.S(4.6, 2.6, 4.6)), C(def.scarf), 0.25, this.cloth);
      G.draw('box', G.chain(Mt, G.T(-4, torso, 2), G.Rz(-0.9 - sw), G.T(0, -5, 0), G.S(1, 10, 2.6)), C(def.scarf), 0.25, this.cloth);
    }

    // --- 팔 ---
    const hands = {};
    for (const [side, z] of [['L', -sh * b], ['R', sh * b]]) {
      const A = side === 'L' ? P.aL : P.aR;
      const Ms = G.chain(Mt, G.T(0, torso - 1, z), G.Ry(A.yaw), G.Rz(A.pitch), G.Rx(A.roll));
      G.draw('ball', G.chain(Ms, G.S(3.6 * b, 3.6 * b, 3.6 * b)), C(def.armor || def.coat), def.armor ? 0.05 : 0, def.armor ? { spec: 0.8, shine: 40 } : this.cloth);
      if (def.armor) G.draw('ball', G.chain(Ms, G.T(0, 1.5, 0), G.S(5.2 * b, 3.6, 5.4 * b)), C(def.armor), 0.05, { spec: 0.8, shine: 40, rim: 0.4 });
      G.draw('tube', G.chain(Ms, G.T(0, -upper, 0), G.S(2.5 * b, upper, 2.5 * b)), C(def.coat), 0, this.cloth);
      const Me = G.chain(Ms, G.T(0, -upper, 0), G.Rz(A.elbow));
      G.draw('tube', G.chain(Me, G.T(0, -fore, 0), G.S(2.2 * b, fore, 2.2 * b)), C(def.coat), 0, this.cloth);
      G.draw('tube', G.chain(Me, G.T(0, -fore + 0.5, 0), G.S(2.5 * b, 2.4, 2.5 * b)), C(def.coatTrim), 0.3);   // 소매 끝
      G.draw('ball', G.chain(Me, G.T(0, -fore - 1.5, 0), G.S(2.4, 2.6, 2.4)), C(def.skin), 0, this.skinM);
      hands[side] = G.chain(Me, G.T(0, -fore - 2, 0));
    }

    // --- 머리 ---
    const Mn = G.chain(Mt, G.T(0, torso + 1, 0), G.Rz(P.lean * 0.4 + P.head));
    G.draw('tube', G.chain(Mn, G.S(2.2, 3, 2.2)), C(def.skin), 0, this.skinM);
    const Mhd = G.chain(Mn, G.T(0.5, 8.5 * s, 0));
    G.draw('ball', G.chain(Mhd, G.S(6.6 * s, 7.4 * s, 6.4 * s)), C(def.skin), 0, this.skinM);
    // 눈 (관측 중 에메랄드로 빛남)
    const eye = o.observe ? '#3fe0a8' : def.eye;
    for (const z of [-2.3, 2.3]) G.draw('box', G.chain(Mhd, G.T(6 * s, 0.8, z * s), G.S(0.8, 1.4, 1.6)), this.c(eye, o.alpha), o.observe ? 1 : 0.6);
    this.hair(G, def, Mhd, s, C, P);

    // --- 무기 ---
    const W = GL.Assets.Weapons, glow = P.glow;
    if (def.weapon === 'baren') {
      // 타워 쉴드 : 왼팔 쪽에 붙어 있다가 가드 때 정면으로
      const k = P.shield;
      const M = G.chain(Mt, G.T(6 + 12 * k, 12 - 2 * k, -(sh + 5) * b * (1 - k * 0.85)), G.Ry(0.9 * (1 - k)));
      W.baren(G, M, { glow: glow * (k > 0 ? 1 : 0.3), t: o.t });
      // 오른손 : 건틀릿
      G.draw('ball', G.chain(hands.R, G.S(3.6, 3.6, 3.6)), C(def.armor), 0.1, { spec: 0.9, shine: 40 });
    } else if (def.dual) {
      for (const side of ['L', 'R']) {
        const grip = G.chain(hands[side], G.Rz(-Math.PI / 2 + 0.25));
        W[def.weapon](G, grip, { glow, t: o.t });
      }
    }
  },

  hair(G, def, Mh, s, C, P) {
    if (def.hairStyle === 'spiky') {
      G.draw('ball', G.chain(Mh, G.T(-0.8, 1.6, 0), G.S(7.2 * s, 6.8 * s, 7.0 * s)), C(def.hair), 0, { spec: 0.4, shine: 30, rim: 0.5 });
      for (let i = 0; i < 6; i++) {
        const a = -0.9 + i * 0.36;
        G.draw('cone2', G.chain(Mh, G.T(-2, 4, 0), G.Rx(a), G.Rz(0.9), G.S(2.4, 9, 2.4)), C(def.hair), 0, { spec: 0.4, shine: 30, rim: 0.5 });
      }
      G.draw('cone2', G.chain(Mh, G.T(4, 4.5, 0), G.Rz(-1.9), G.S(2.6, 6, 3.4)), C(def.hair), 0, { spec: 0.4, shine: 30 });   // 앞머리
    } else if (def.hairStyle === 'short') {
      G.draw('ball', G.chain(Mh, G.T(-0.6, 2.2, 0), G.S(7.0 * s, 6.0 * s, 6.8 * s)), C(def.hair), 0, { spec: 0.2 });
      G.draw('tube', G.chain(Mh, G.T(0, 3.2, 0), G.S(7.1 * s, 1.6, 7.1 * s)), C(def.coatTrim), 0.3, { spec: 0.7, shine: 30 }); // 머리띠
    } else if (def.hairStyle === 'hood') {
      G.draw('ball', G.chain(Mh, G.T(-1.2, 1.2, 0), G.S(8.2 * s, 8.4 * s, 8.0 * s)), C(def.coat), 0, this.cloth);
      G.draw('cone2', G.chain(Mh, G.T(-5, 3, 0), G.Rz(1.9), G.S(4, 8, 4)), C(def.coat), 0, this.cloth);
      G.draw('box', G.chain(Mh, G.T(6.4, -3, 0), G.S(1, 4, 9)), C(def.scarf || def.coatTrim), 0.3);   // 마스크
    }
  },
};

</script>
<script>
// ===== js/assets/monsters.js =====
// ============================================================
// assets/monsters.js — 적·보스 모델 (노이즈 기형체)
// 실제 모델로 바꿀 때는 각 타입의 draw 함수만 교체하면 된다.
//   e : 적 객체 (x, y, facing, groggy, hitFlash, 상태값 …)
//   공격 예고가 진행 중이면 windup(0~1)으로 들어 올리는 자세를 만든다
// ============================================================
GL.Assets = GL.Assets || {};

GL.Assets.Monsters = {
  style: {
    shard:    { body: '#ff5a6e', core: '#ffd0d8', crack: '#2a0610' },
    eroder:   { body: '#3a1c12', iris: '#ff8a3d', ring: '#ffd0a0', frag: '#ff8a3d' },
    clasher:  { rock: '#4a3560', crystal: '#c25cff', arm: '#3a2a4e', guard: '#e2b8ff' },
    guardian: { armor: '#3e5c96', trim: '#c9dcff', visor: '#9fc4ff', cloth: '#1c2640' },
    tempus:   { core: '#d36bff', gear: '#f0c8ff', metal: '#2a1a40', hand: '#ffffff', cape: '#1a1030' },
  },
  c(hex, a = 1) { return GL.G3.rgba(hex, a); },
  stone: { spec: 0.15, shine: 10, rim: 0.4 },
  metal: { spec: 0.85, shine: 44, rim: 0.45 },

  // 이 적이 지금 공격 예고 중인지 (0~1 진행도)
  windup(e) {
    let w = 0;
    for (const t of GL.World.tele) if (t.owner === e) w = Math.max(w, Math.min(1, t.t / t.warn));
    return w;
  },
  tint(e, hex) { return e.hitFlash > 0 ? '#ffffff' : (e.groggy > 0 ? '#e8d26a' : hex); },

  draw(G, e) {
    if (e instanceof GL.Shard) return this.shard(G, e);
    if (e instanceof GL.Eroder) return this.eroder(G, e);
    if (e instanceof GL.Clasher) return this.clasher(G, e);
    if (e instanceof GL.Guardian) return this.guardian(G, e);
    if (e instanceof GL.Echo) return this.tempus(G, e, 0.6, 0.45);
    if (e instanceof GL.Tempus) return this.tempus(G, e, 1, 1);
  },

  // ---------- ① 노이즈 파편체 : 깨진 결정 덩어리, 자폭 준비 때 벌어지며 붉게 ----------
  shard(G, e) {
    const s = this.style.shard, t = GL.World.time, ch = e.state === 'charge';
    const open = ch ? 4 + Math.sin(t * 30) * 2 : 0, bob = Math.sin(t * 4 + e.x) * 3;
    const R0 = G.root(e.x, 22 + bob, e.y, t * (ch ? 6 : 1.5));
    const col = ch && Math.sin(t * 30) > 0 ? '#ffffff' : this.tint(e, s.body);
    G.draw('ball', G.chain(R0, G.S(7, 7, 7)), this.c(ch ? '#ff2040' : s.core), ch ? 1 : 0.7);
    for (let i = 0; i < 5; i++) {
      const a = i * 1.2566;
      const M = G.chain(R0, G.Ry(a), G.Rz(0.5 + (i % 2) * 0.5), G.T(0, 8 + open, 0));
      G.draw('octa', G.chain(M, G.S(5, 12 + (i % 3) * 3, 5)), this.c(col), 0.15, { spec: 0.7, shine: 40, rim: 0.6 });
    }
    // 주위를 도는 작은 파편
    for (let i = 0; i < 3; i++) {
      const a = t * 3 + i * 2.09;
      G.draw('octa', G.chain(G.T(e.x + Math.cos(a) * 16, 26 + bob + Math.sin(a * 2) * 4, e.y + Math.sin(a) * 16), G.S(2, 3, 2)), this.c(s.body), 0.5);
    }
  },

  // ---------- ② 데이터 침식자 : 떠다니는 눈 + 공전 파편 + 아래로 늘어진 촉수 ----------
  eroder(G, e) {
    const s = this.style.eroder, t = GL.World.time, w = this.windup(e) || (e.cd < 0.4 ? 1 - e.cd / 0.4 : 0);
    const h = 46 + Math.sin(t * 3 + e.x) * 5;
    const R0 = G.root(e.x, h, e.y, e.facing);
    G.draw('ball', G.chain(R0, G.S(14, 13, 14)), this.c(this.tint(e, s.body)), 0.05, { spec: 0.6, shine: 30, rim: 0.7 });
    G.draw('ball', G.chain(R0, G.T(10, 0, 0), G.S(5.5, 6.5 + w * 2, 6.5 + w * 2)), this.c(s.iris), 0.9);            // 눈동자
    G.draw('ball', G.chain(R0, G.T(13.5, 0, 0), G.S(2, 3, 3)), this.c('#1a0800'), 0.2);
    G.draw('thinRing', G.chain(R0, G.Rz(0.5), G.Ry(t * 1.5), G.S(22, 22, 22)), this.c(s.ring, 0.9), 0.8);
    for (let i = 0; i < 4; i++) {
      const a = t * 2 + i * 1.57;
      G.draw('octa', G.chain(R0, G.T(Math.cos(a) * 20, Math.sin(a * 1.3) * 6, Math.sin(a) * 20), G.Ry(a), G.S(3, 5, 3)), this.c(s.frag), 0.6);
    }
    for (let i = 0; i < 3; i++) { // 촉수
      const a = i * 2.09 + t;
      G.draw('cone2', G.chain(R0, G.T(-3 + Math.cos(a) * 5, -9, Math.sin(a) * 5), G.Rz(Math.PI + Math.sin(t * 3 + i) * 0.3), G.S(2.2, 16, 2.2)), this.c(this.tint(e, s.body)), 0.05);
    }
  },

  // ---------- ④ 균열의 파쇄손 : 거대한 바위 팔을 가진 골렘, 정면 결정 가드 ----------
  clasher(G, e) {
    const s = this.style.clasher, t = GL.World.time, w = this.windup(e);
    const R0 = G.root(e.x, 0, e.y, e.facing);
    const col = this.c(this.tint(e, s.rock));
    const step = Math.sin(t * 4 + e.x) * 0.3;
    for (const z of [-9, 9]) G.draw('box', G.chain(R0, G.T(0, 8, z), G.Rz(z > 0 ? step : -step), G.T(0, 0, 0), G.S(12, 16, 9)), col, 0, this.stone);
    const Mb = G.chain(R0, G.T(-2, 24, 0), G.Rz(0.25 + w * 0.2));
    G.draw('box', G.chain(Mb, G.S(26, 26, 30)), col, 0, this.stone);
    G.draw('box', G.chain(Mb, G.T(4, 16, 0), G.S(12, 10, 14)), col, 0, this.stone);          // 머리
    G.draw('box', G.chain(Mb, G.T(10.5, 16, 0), G.S(1, 2, 9)), this.c(s.crystal), 1);        // 눈
    for (let i = 0; i < 4; i++) G.draw('octa', G.chain(Mb, G.T(-10, 10 + i * 2, -9 + i * 6), G.Rz(-0.6), G.S(4, 10 + i * 2, 4)), this.c(s.crystal), 0.6, { spec: 0.8, shine: 40, rim: 0.6 });
    // 거대 팔 (예고 중 들어 올림)
    const lift = w > 0 ? 1.6 * w : 0;
    const Ma = G.chain(Mb, G.T(2, 8, 20), G.Rz(-0.4 + lift), G.Rx(-0.15));
    G.draw('box', G.chain(Ma, G.T(10, 0, 0), G.S(24, 13, 13)), this.c(this.tint(e, s.arm)), 0, this.stone);
    G.draw('box', G.chain(Ma, G.T(26, -2, 0), G.S(16, 22, 20)), this.c(this.tint(e, s.arm)), 0, this.stone);
    G.draw('box', G.chain(Mb, G.T(2, 6, -18), G.Rz(-0.8), G.T(8, 0, 0), G.S(18, 9, 9)), col, 0, this.stone);
    // 정면 결정 가드
    if (e.guardUp && e.groggy <= 0) {
      G.draw('box', G.chain(R0, G.T(24, 26, 0), G.S(5, 40, 46)), this.c(s.guard, 0.85), 0.45, { spec: 0.9, shine: 50, rim: 0.8 });
    }
  },

  // ---------- 엘리트 : 아카이브 집행 수호자 (갑옷 기사, 방패 + 철퇴) ----------
  guardian(G, e) {
    const s = this.style.guardian, t = GL.World.time, w = this.windup(e);
    const R0 = G.root(e.x, 0, e.y, e.facing);
    const C = (hex) => this.c(this.tint(e, hex));
    const step = Math.sin(t * 3.5 + e.x) * 0.35;
    for (const [z, k] of [[-8, 1], [8, -1]]) {
      const Mh = G.chain(R0, G.T(0, 30, z), G.Rz(step * k));
      G.draw('tube', G.chain(Mh, G.T(0, -15, 0), G.S(5, 15, 5)), C(s.cloth), 0);
      G.draw('box', G.chain(Mh, G.T(1, -24, 0), G.S(9, 16, 8)), C(s.armor), 0.05, this.metal);
      G.draw('box', G.chain(Mh, G.T(3, -31, 0), G.S(13, 4, 9)), C(s.armor), 0.05, this.metal);
    }
    const Mt = G.chain(R0, G.T(0, 30, 0), G.Rz(0.1 + w * 0.15));
    G.draw('wedge', G.chain(Mt, G.T(0, 18, 0), G.Rz(Math.PI), G.S(18, 36, 34)), C(s.armor), 0.05, this.metal);
    G.draw('box', G.chain(Mt, G.T(9, 18, 0), G.S(2, 24, 6)), C(s.trim), 0.4, this.metal);
    G.draw('wedge', G.chain(Mt, G.T(-6, 4, 0), G.Rz(-0.15), G.T(0, -10, 0), G.S(4, 22, 28)), C(s.cloth), 0);   // 망토
    for (const z of [-19, 19]) G.draw('ball', G.chain(Mt, G.T(0, 34, z), G.S(9, 7, 10)), C(s.armor), 0.05, this.metal); // 견갑
    const Mhd = G.chain(Mt, G.T(1, 44, 0));
    G.draw('box', G.chain(Mhd, G.S(14, 15, 13)), C(s.armor), 0.05, this.metal);
    G.draw('box', G.chain(Mhd, G.T(7.2, 1, 0), G.S(1, 3, 10)), this.c(s.visor), 1);           // 투구 틈 빛
    G.draw('cone2', G.chain(Mhd, G.T(0, 7, 0), G.S(4, 10, 4)), C(s.trim), 0.2, this.metal);
    // 철퇴 팔 (예고 중 들어 올림)
    const Ma = G.chain(Mt, G.T(0, 32, -21), G.Rz(0.3 + w * 2.2), G.Ry(-0.2));
    G.draw('tube', G.chain(Ma, G.T(0, -20, 0), G.S(4.5, 20, 4.5)), C(s.armor), 0.05, this.metal);
    GL.Assets.Weapons.guardianMace(G, G.chain(Ma, G.T(0, -22, 0), G.Rz(-Math.PI / 2 + 1.2)));
    // 방패 (정면)
    if (e.shieldUp && e.groggy <= 0) GL.Assets.Weapons.guardianShield(G, G.chain(R0, G.T(26, 36, 6)));
    else GL.Assets.Weapons.guardianShield(G, G.chain(R0, G.T(4, 16, 26), G.Ry(1.3), G.Rz(0.6)), { alpha: 0.9 });
  },

  // ---------- 템푸스 : 시계 장치 거신 (코어 + 톱니 고리 + 바늘) / 시차 분신은 반투명 ----------
  tempus(G, e, sc, alpha) {
    const s = this.style.tempus, t = GL.World.time, gro = e.groggy > 0;
    const w = this.windup(e);
    const h = (gro ? 52 : 92) * sc + Math.sin(t * 2) * 4;
    const R0 = G.root(e.x, h, e.y, e.facing);
    const C = (hex, a = alpha) => this.c(e.hitFlash > 0 ? '#ffffff' : (gro ? '#e8d26a' : hex), a);
    // 아래 망토(시간의 찌꺼기가 흘러내림)
    G.draw('cone2', G.chain(G.T(e.x, 0, e.y), G.Ry(t * 0.2), G.S(46 * sc, 70 * sc, 46 * sc)), C(s.cape, alpha * 0.95), 0.05, { spec: 0.2, rim: 0.6 });
    // 코어
    G.draw('ball', G.chain(R0, G.S(22 * sc, 22 * sc, 22 * sc)), C(s.core), 0.9);
    // 코어를 감싼 4개의 금속 날개 (사이로 빛나는 코어가 보임)
    for (let i = 0; i < 4; i++) G.draw('wedge', G.chain(R0, G.Ry(t * 0.6 + i * 1.5708), G.T(20 * sc, 0, 0), G.Rz(Math.PI / 2), G.S(14 * sc, 10 * sc, 30 * sc)), C(s.metal, alpha), 0.1, this.metal);
    G.draw('octa', G.chain(R0, G.T(0, 30 * sc, 0), G.Ry(t), G.S(8 * sc, 16 * sc, 8 * sc)), C(s.gear), 0.6, this.metal);
    G.draw('octa', G.chain(R0, G.T(0, -30 * sc, 0), G.Ry(-t), G.S(8 * sc, 16 * sc, 8 * sc)), C(s.gear), 0.6, this.metal);
    // 톱니 고리 3개 (서로 다른 축으로 회전)
    const rings = [[54, 1.2, t * 0.9], [70, 1.45, -t * 0.5], [86, 0.35, t * 0.3]];
    rings.forEach(([r, tilt, rot], k) => {
      const M = G.chain(R0, G.Rx(tilt), G.Ry(rot));
      G.draw('ring', G.chain(M, G.S(r * sc, r * sc, r * sc)), C(k === 1 ? s.core : s.gear), 0.75, this.metal);
      const teeth = k === 2 ? 18 : 12;
      for (let i = 0; i < teeth; i++) {
        const a = i / teeth * 6.2832;
        G.draw('box', G.chain(M, G.T(Math.cos(a) * r * sc, 0, Math.sin(a) * r * sc), G.Ry(-a), G.S(6 * sc, 4 * sc, 4 * sc)), C(s.gear), 0.4, this.metal);
      }
    });
    // 시계 바늘 (예고 중 빠르게 돎)
    const spin = t * (2 + w * 10);
    G.draw('box', G.chain(R0, G.T(22 * sc, 0, 0), G.Rx(spin), G.T(0, 18 * sc, 0), G.S(3, 36 * sc, 3)), C(s.hand), 0.9);
    G.draw('box', G.chain(R0, G.T(22 * sc, 0, 0), G.Rx(-t * 0.7), G.T(0, 11 * sc, 0), G.S(3.5, 22 * sc, 3.5)), C(s.hand), 0.9);
    // 양팔 : 떠 있는 칼날 손
    for (const z of [-1, 1]) {
      const Ma = G.chain(R0, G.T(0, -6 * sc, z * 46 * sc), G.Ry(z * (0.4 - w * 0.9)), G.Rz(-0.4 + w * 1.2));
      G.draw('blade', G.chain(Ma, G.S(48 * sc, 70 * sc, 60 * sc)), C(s.gear), 0.35, this.metal);
    }
  },
};

</script>
<script>
// ===== js/assets/effects.js =====
// ============================================================
// assets/effects.js — 이펙트 (공격 궤적, 파쇄 유리 파편, 예고 범위, 장판, 버프, 투사체, 아이템)
// 세 단계로 그린다 : solid(불투명 3D) → decal(바닥 반투명) → glow(빛 더하기)
// 실제 이펙트(파티클·셰이더)로 바꿀 때는 해당 함수만 교체하면 된다.
// ============================================================
GL.Assets = GL.Assets || {};

GL.Assets.Effects = {
  c(hex, a = 1) { return GL.G3.rgba(hex, a); },
  glass: { spec: 1.0, shine: 60, rim: 0.8 },

  // ---------- 1) 불투명 : 투사체, 파편, 불꽃, 아이템, 매듭, 그로기 별 ----------
  solid(G) {
    const W = GL.World, t = W.time;
    // 적 투사체 : 데이터 탄환 (핵 + 꼬리)
    for (const s of W.eShots) {
      const a = Math.atan2(s.vy, s.vx);
      G.draw('ball', G.chain(G.T(s.x, 40, s.y), G.S(6, 6, 6)), this.c('#ffe0c0'), 1);
      G.draw('cone2', G.chain(G.root(s.x, 40, s.y, a + Math.PI), G.Rz(-Math.PI / 2), G.S(5, 22, 5)), this.c('#ff8a3d', 0.85), 1);
    }
    // 플레이어 투사체 : 단검 / 반사 탄
    for (const s of W.pShots) {
      const a = Math.atan2(s.vy, s.vx);
      if (s.dagger) GL.Assets.Weapons.kay(G, G.root(s.x, 26, s.y, a), { glow: 1 });
      else G.draw('ball', G.chain(G.T(s.x, 30, s.y), G.S(s.r, s.r, s.r)), this.c(s.color || '#ffffff'), 1);
    }
    // 유리 파편 / 불꽃
    for (const f of W.fx) {
      const k = f.t / f.life;
      if (f.kind === 'shard') {
        const hh = 12 + Math.sin(k * Math.PI) * 55;
        G.draw('octa', G.chain(G.T(f.x, hh, f.y), G.Ry(f.rot + k * 8), G.Rx(k * 6), G.S(f.size * 0.7, f.size, f.size * 0.25)), [0.85, 0.95, 1, 1 - k * 0.7], 0.55, this.glass);
      }
    }
    // 회복 데이터
    for (const k of W.pickups) {
      const by = Math.sin(t * 4 + k.x) * 5;
      G.draw('octa', G.chain(G.T(k.x, 24 + by, k.y), G.Ry(t * 2), G.S(8, 12, 8)), this.c('#3fe0a8'), 0.85, this.glass);
      G.draw('thinRing', G.chain(G.T(k.x, 24 + by, k.y), G.Rx(t), G.S(13, 13, 13)), this.c('#c8fff0'), 1);
    }
    // 그로기 : 머리 위를 도는 유리 별
    for (const e of W.enemies) {
      if (e.dead || e.groggy <= 0) continue;
      const top = e.boss ? 150 : (e instanceof GL.Guardian ? 100 : 66);
      for (let i = 0; i < 4; i++) {
        const a = t * 4 + i * 1.57;
        G.draw('octa', G.chain(G.T(e.x + Math.cos(a) * (e.r + 8), top, e.y + Math.sin(a) * (e.r + 8)), G.Ry(t * 5), G.S(4, 6, 4)), this.c('#ffe066'), 1);
      }
    }
  },

  // ---------- 2) 바닥 반투명 : 그림자, 장판, 예고 범위, 역류 궤적, 약점 고리, 버프 ----------
  decals(G) {
    const W = GL.World, t = W.time, p = GL.Party.player;
    // 그림자
    G.decal(G.circle(p.x, p.y, 13 * Math.max(0.5, 1 - p.z / 300), 18), 0.4, [0, 0, 0, 0.5]);
    for (const e of W.enemies) if (!e.dead) G.decal(G.circle(e.x, e.y, e.r * 1.1, 18), 0.4, [0, 0, 0, 0.45]);
    this.fields(G, t);
    this.tele(G);
    this.reversal(G);
    // 약점 고리
    for (const e of W.enemies) {
      if (e.dead || !GL.Combat.weakVisible(e)) continue;
      G.decal(G.ringStrip(e.x, e.y, e.r + 12, e.r + 16 + Math.sin(t * 8) * 2), 1.5, [0.25, 0.88, 0.66, 0.8]);
    }
    // 플레이어 버프 / 차지 / 락온
    const B = W.buffs;
    if (B.barrier > 0) G.decal(G.ringStrip(p.x, p.y, 34, 40 + Math.sin(t * 6) * 2), 1.6, [0.88, 0.71, 0.29, 0.8]);
    if (B.fortress > 0) G.decal(G.ringStrip(p.x, p.y, 22, 25), 1.6, [0.88, 0.71, 0.29, 0.6]);
    const cr = GL.Input.chargeRatio();
    if (cr > 0.15) G.decal(G.ringStrip(p.x, p.y, 20, 25, -Math.PI / 2, 6.2832 * cr, 30), 1.7, [1, 1, 1, cr >= 1 ? 1 : 0.6]);
    const tg = GL.Party.softTarget;
    if (tg && !tg.dead) G.decal(G.ringStrip(tg.x, tg.y, (tg.r || 20) + 18, (tg.r || 20) + 21, t * 2, 4.5, 24), 1.7, [1, 1, 1, 0.5]);
    if (W.observe.on) for (const s of W.eShots) G.decal(G.rect(s.x, s.y, Math.atan2(s.vy, s.vx), Math.hypot(s.vx, s.vy) * 1.2, 3), 1.9, [0.25, 0.88, 0.66, 0.6]);
    // 회복 데이터 바닥 빛
    for (const k of W.pickups) G.decal(G.circle(k.x, k.y, 16), 0.6, [0.25, 0.88, 0.66, 0.25]);
  },

  fields(G, t) {
    for (const f of GL.World.fields) {
      if (f.kind === 'slow') {
        G.decal(G.circle(f.x, f.y, f.r), 0.8, [0.63, 0.43, 1, 0.16]);
        G.decal(G.ringStrip(f.x, f.y, f.r - 3, f.r), 0.9, [0.75, 0.6, 1, 0.7]);
        for (let i = 0; i < 12; i++) G.decal(G.rect(f.x + Math.cos(i * 0.5236) * (f.r - 14), f.y + Math.sin(i * 0.5236) * (f.r - 14), i * 0.5236, 8, 2), 0.95, [0.75, 0.6, 1, 0.6]); // 시계 눈금
        G.decal(G.rect(f.x, f.y, t * 2, f.r * 0.85, 4), 0.9, [0.75, 0.6, 1, 0.7]);
        G.decal(G.rect(f.x, f.y, t * 0.3, f.r * 0.55, 6), 0.9, [0.75, 0.6, 1, 0.7]);
      } else if (f.kind === 'rift') {
        if (!f.armed) { for (let i = 0; i < 12; i += 2) G.decal(G.ringStrip(f.x, f.y, f.r - 3, f.r, i / 12 * 6.283, 6.283 / 12, 4), 0.9, [1, 0.25, 0.35, 0.8]); }
        else {
          G.decal(G.circle(f.x, f.y, f.r), 0.8, [0.8, 0.08, 0.2, 0.3]);
          for (let i = 0; i < 7; i++) G.decal(G.rect(f.x, f.y, i * 0.9 + f.x, f.r * (0.6 + (i % 3) * 0.2), 3), 0.9, [1, 0.35, 0.45, 0.8]);
        }
      } else if (f.kind === 'cut') {
        const s = f.shape;
        G.decal(G.rect(s.x, s.y, s.dir, s.len, s.w), 0.8, [0.8, 1, 0.95, 0.12 + 0.05 * Math.sin(t * 20)]);
      }
    }
  },

  shapeTris(G, s) {
    if (s.kind === 'arc') return G.sector(s.x, s.y, s.r, s.dir, s.arc);
    if (s.kind === 'line') return G.rect(s.x, s.y, s.dir, s.len, s.w);
    return G.circle(s.x, s.y, s.r);
  },
  tele(G) {
    const t0 = GL.World.time;
    for (const t of GL.World.tele) {
      const k = Math.min(1, t.t / t.warn);
      const col = t.ghost ? [0.7, 0.43, 1] : (t.red ? [1, 0.16, 0.31] : [1, 0.59, 0.24]);
      G.decal(this.shapeTris(G, t), 1.0, [...col, 0.1 + 0.2 * k]);
      const inner = { ...t };
      if (t.kind === 'line') inner.len = t.len * k; else inner.r = (t.r || 60) * k;
      G.decal(this.shapeTris(G, inner), 1.1, [...col, 0.22]);
      const pulse = t.red ? 0.75 + 0.25 * Math.sin(t0 * 20) : 0.9;
      if (t.kind !== 'line') {
        const full = !(t.kind === 'arc' && t.arc < 6.28);
        G.decal(G.ringStrip(t.x, t.y, t.r - (t.red ? 5 : 3), t.r, full ? 0 : t.dir - t.arc / 2, full ? 6.2832 : t.arc, 30), 1.2, [...col, pulse]);
      } else {
        G.decal(G.rect(t.x, t.y, t.dir, t.len, 3), 1.2, [...col, pulse]);
      }
    }
  },
  reversal(G) {
    const b = GL.Boss.current;
    if (!b || b.mode !== 'reversal') return;
    const h = b.history;
    for (let i = 1; i < h.length; i++) {
      if (i % 2) continue;
      const a = Math.atan2(h[i].y - h[i - 1].y, h[i].x - h[i - 1].x), d = Math.hypot(h[i].y - h[i - 1].y, h[i].x - h[i - 1].x);
      G.decal(G.rect(h[i - 1].x, h[i - 1].y, a, d, 10), 1.3, [1, 0.24, 0.35, 0.6]);
    }
  },

  // ---------- 3) 빛 더하기 : 베기 궤적, 충격 고리, 불꽃, 약점 코어, 매듭, 보호막, 시차 분신 ----------
  glow(G) {
    const W = GL.World, t = W.time, p = GL.Party.player;
    G.blend('add');
    for (const f of W.fx) {
      const k = f.t / f.life;
      const c = f.color ? this.c(f.color) : [1, 1, 1, 1];
      if (f.kind === 'ring') {
        const r = f.r * (0.4 + 0.6 * k);
        G.decal(G.ringStrip(f.x, f.y, Math.max(0, r - 7), r), 1.8, [c[0], c[1], c[2], (1 - k) * 0.9]);
      } else if (f.kind === 'slash') {
        // 초승달 모양 궤적 : 바깥쪽이 밝고 안쪽으로 옅어짐, 공중에 살짝 띄움
        const sweep = f.arc * Math.min(1, k * 3);
        const a0 = f.dir - f.arc / 2;
        G.decal(G.ringStrip(f.x, f.y, f.r * 0.55, f.r, a0, sweep, 24), 22, [c[0], c[1], c[2], (1 - k) * 0.35]);
        G.decal(G.ringStrip(f.x, f.y, f.r * 0.86, f.r, a0, sweep, 24), 22.5, [1, 1, 1, (1 - k) * 0.7]);
      } else if (f.kind === 'line') {
        G.decal(G.rect(f.x, f.y, f.dir, f.len, f.w * (1 - k * 0.6)), 20, [c[0], c[1], c[2], (1 - k) * 0.55]);
        G.decal(G.rect(f.x, f.y, f.dir, f.len, Math.max(2, f.w * 0.2)), 20.5, [1, 1, 1, (1 - k) * 0.9]);
      } else if (f.kind === 'spark') {
        const a = Math.atan2(f.vy, f.vx);
        G.draw('box', G.chain(G.root(f.x, 28, f.y, a), G.S(10 * (1 - k) + 2, 1.6, 1.6)), [c[0], c[1], c[2], 1 - k], 1);
      }
    }
    // 약점 코어
    for (const e of W.enemies) {
      if (e.dead || !GL.Combat.weakVisible(e)) continue;
      const f = e.facing;
      let ox = 0, oy = 0, h = 30;
      if (e.guardUp || e.shieldUp) { ox = Math.cos(f) * (e.r + 6); oy = Math.sin(f) * (e.r + 6); h = 40; }
      if (e.boss) { ox = -Math.cos(f) * 34; oy = -Math.sin(f) * 34; h = 92; }
      G.draw('octa', G.chain(G.T(e.x + ox, h, e.y + oy), G.Ry(t * 3), G.S(7, 10, 7)), this.c('#3fe0a8'), 1);
      G.draw('ball', G.chain(G.T(e.x + ox, h, e.y + oy), G.S(14, 14, 14)), this.c('#3fe0a8', 0.25 + 0.1 * Math.sin(t * 8)), 1);
    }
    // 보스 기믹 매듭 (관측 중에만)
    for (const k of GL.Boss.knots) {
      if (k.frac <= 0) continue;
      if (W.observe.on) {
        G.draw('octa', G.chain(G.T(k.x, 46, k.y), G.Ry(t * 2), G.S(14, 20, 14)), this.c('#3fe0a8'), 1);
        G.draw('ring', G.chain(G.T(k.x, 46, k.y), G.Ry(t * 1.5), G.Rx(Math.PI / 2), G.S(26, 26, 26)), this.c('#c8fff0', 0.9), 1);
        G.draw('tube', G.chain(G.T(k.x, 0, k.y), G.S(4, 420, 4)), this.c('#3fe0a8', 0.35), 1);
        G.decal(G.ringStrip(k.x, k.y, 30, 36, -Math.PI / 2, 6.2832 * (k.frac / k.max), 30), 1.4, [1, 1, 1, 0.9]);
      } else {
        G.draw('ball', G.chain(G.T(k.x, 46, k.y), G.S(6, 6, 6)), [0.6, 0.7, 0.8, 0.15 + 0.08 * Math.sin(t * 6)], 1);
      }
    }
    // 무기 잔광 / 보호막
    if (W.buffs.shield > 0) G.draw('ball', G.chain(G.T(p.x, p.z * 0.6 + 28, p.y), G.S(26, 32, 26)), [0.62, 0.9, 1, 0.16], 1);
    if (W.observe.on) G.draw('thinRing', G.chain(G.T(p.x, p.z * 0.6 + 1, p.y), G.Ry(t), G.S(40, 40, 40)), this.c('#3fe0a8', 0.5), 1);
    G.blend('normal');
  },

  // ---------- 마스터 모드 : 판정 범위 표시 ----------
  debug(G) {
    if (!GL.Master || !GL.Master.opt.hitbox) return;
    const p = GL.Party.player;
    G.decal(G.ringStrip(p.x, p.y, p.r - 1.5, p.r), 30, [0.3, 1, 0.4, 1]);
    for (const e of GL.World.enemies) if (!e.dead) G.decal(G.ringStrip(e.x, e.y, e.r - 1.5, e.r), 30, [1, 0.3, 0.3, 1]);
    for (const s of GL.Master.shapes) G.decal(this.shapeTris(G, s), 30, [1, 1, 0.2, 0.25 * (s.life / 0.4)]);
  },
};

</script>
<script>
// ===== js/assets/background.js =====
// ============================================================
// assets/background.js — 배경 (하늘, 바닥, 경계 장벽, 데이터 모노리스, 떠다니는 입자, 포털)
// 스테이지마다 테마를 themes 에 정의. 실제 배경 모델로 바꿀 때는 build / draw 를 교체하면 된다.
// ============================================================
GL.Assets = GL.Assets || {};

GL.Assets.Background = {
  themes: {
    field: { // 표면 현실 : 차가운 디지털 블루/화이트
      sky: [[0.05, 0.10, 0.20], [0.01, 0.02, 0.05]], ground: [0.045, 0.075, 0.13], fog: [0.03, 0.06, 0.11],
      wall: '#5d8fd6', mono: '#14223a', seam: '#7fb4ff', mote: '#9fd0ff', rimC: [0.45, 0.7, 1.0],
    },
    boss: { // 인과 균열 : 보랏빛 시간의 잔해
      sky: [[0.16, 0.06, 0.22], [0.02, 0.01, 0.04]], ground: [0.07, 0.05, 0.12], fog: [0.07, 0.035, 0.10],
      wall: '#b07bff', mono: '#1a1430', seam: '#d36bff', mote: '#f0c8ff', rimC: [0.8, 0.5, 1.0],
    },
  },
  props: [], motes: [], islands: [],

  theme() { return this.themes[GL.Stage.name] || this.themes.field; },
  c(hex, a = 1) { return GL.G3.rgba(hex, a); },

  // 스테이지가 바뀔 때 배치
  build() {
    const b = GL.Stage.bounds, light = GL.Touch && GL.Touch.enabled;
    const rnd = (a, z) => a + Math.random() * (z - a);
    this.props = [];
    const n = light ? 14 : 26;
    for (let i = 0; i < n; i++) {
      const side = i % 4, t = (Math.floor(i / 4) + 0.5) / Math.ceil(n / 4);
      let x, y;
      if (side === 0) { x = b.x + b.w * t; y = b.y - rnd(120, 320); }
      if (side === 1) { x = b.x + b.w * t; y = b.y + b.h + rnd(120, 320); }
      if (side === 2) { x = b.x - rnd(120, 320); y = b.y + b.h * t; }
      if (side === 3) { x = b.x + b.w + rnd(120, 320); y = b.y + b.h * t; }
      this.props.push({ x, y, w: rnd(40, 100), h: rnd(160, 540), a: Math.random() * 3, seams: 2 + Math.floor(Math.random() * 3), cube: Math.random() < 0.5 });
    }
    this.motes = [];
    for (let i = 0; i < (light ? 30 : 70); i++) this.motes.push({ x: rnd(b.x - 200, b.x + b.w + 200), y: rnd(b.y - 200, b.y + b.h + 200), h: rnd(20, 260), s: rnd(1.5, 3.5), sp: rnd(6, 20), ph: Math.random() * 6 });
    this.islands = [];
    for (let i = 0; i < (light ? 4 : 8); i++) {
      const a = i / (light ? 4 : 8) * 6.2832 + Math.random() * 0.4, r = Math.max(b.w, b.h) * rnd(0.9, 1.3);
      this.islands.push({ x: b.x + b.w / 2 + Math.cos(a) * r, y: b.y + b.h / 2 + Math.sin(a) * r, h: rnd(120, 420), s: rnd(60, 160), rot: Math.random() * 6 });
    }
  },

  // 카메라가 정해진 뒤 가장 먼저 : 하늘·바닥
  drawBase(G, t, obs) {
    const th = this.theme();
    G.frame.fog = th.fog; G.frame.rimC = th.rimC;
    G.sky(th.sky[0], th.sky[1], t);
    G.ground(GL.Stage.bounds, obs, t, th.ground);
    G.resetProgram();
  },

  // 불투명 구조물
  drawSolid(G, t, obs) {
    const b = GL.Stage.bounds, th = this.theme();
    const wc = this.c(obs ? '#3fe0a8' : th.wall);
    // 경계 받침
    const thk = 16, hh = 10;
    G.draw('box', G.model(b.x + b.w / 2, hh / 2, b.y, 0, b.w + thk, hh, thk), this.c(th.mono), 0, { spec: 0.4 });
    G.draw('box', G.model(b.x + b.w / 2, hh / 2, b.y + b.h, 0, b.w + thk, hh, thk), this.c(th.mono), 0, { spec: 0.4 });
    G.draw('box', G.model(b.x, hh / 2, b.y + b.h / 2, 0, thk, hh, b.h), this.c(th.mono), 0, { spec: 0.4 });
    G.draw('box', G.model(b.x + b.w, hh / 2, b.y + b.h / 2, 0, thk, hh, b.h), this.c(th.mono), 0, { spec: 0.4 });
    G.draw('box', G.model(b.x + b.w / 2, hh + 1, b.y, 0, b.w, 2, 4), wc, 1);
    G.draw('box', G.model(b.x + b.w / 2, hh + 1, b.y + b.h, 0, b.w, 2, 4), wc, 1);
    G.draw('box', G.model(b.x, hh + 1, b.y + b.h / 2, 0, 4, 2, b.h), wc, 1);
    G.draw('box', G.model(b.x + b.w, hh + 1, b.y + b.h / 2, 0, 4, 2, b.h), wc, 1);
    // 데이터 모노리스 : 빛나는 이음새 + 위에 떠 있는 큐브
    for (const p of this.props) {
      G.draw('box', G.model(p.x, p.h / 2, p.y, p.a, p.w, p.h, p.w), this.c(th.mono), 0, { spec: 0.5, shine: 30, rim: 0.5 });
      for (let i = 1; i <= p.seams; i++) G.draw('box', G.model(p.x, p.h * i / (p.seams + 1), p.y, p.a, p.w + 2, 2, p.w + 2), this.c(th.seam), 1);
      G.draw('box', G.model(p.x, p.h - 3, p.y, p.a, p.w + 3, 5, p.w + 3), wc, 0.9);
      if (p.cube) G.draw('box', G.chain(G.T(p.x, p.h + 40 + Math.sin(t + p.a) * 10, p.y), G.Ry(t * 0.6 + p.a), G.Rx(0.6), G.S(p.w * 0.4, p.w * 0.4, p.w * 0.4)), this.c(th.seam), 0.6, { spec: 0.8, shine: 40 });
    }
    // 멀리 떠 있는 부서진 섬
    for (const s of this.islands) {
      const y = s.h + Math.sin(t * 0.5 + s.rot) * 12;
      G.draw('cone2', G.chain(G.T(s.x, y, s.y), G.Ry(s.rot), G.Rz(Math.PI), G.S(s.s, s.s * 1.4, s.s)), this.c(th.mono), 0, { spec: 0.2, rim: 0.6 });
      G.draw('tube', G.chain(G.T(s.x, y, s.y), G.Ry(s.rot), G.S(s.s, 8, s.s)), this.c(th.mono), 0, { spec: 0.3 });
      G.draw('thinRing', G.chain(G.T(s.x, y + 6, s.y), G.S(s.s * 1.02, s.s, s.s * 1.02)), this.c(th.seam), 1);
    }
    // 보스 스테이지 : 하늘의 거대한 시계 고리
    if (GL.Stage.name === 'boss') {
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      G.draw('ring', G.chain(G.T(cx, 520, cy + 900), G.Rx(Math.PI / 2 - 0.2), G.Ry(t * 0.05), G.S(700, 700, 700)), this.c('#3a2056'), 0.6);
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * 6.2832 + t * 0.05;
        G.draw('box', G.chain(G.T(cx, 520, cy + 900), G.Rx(-0.2), G.T(Math.cos(a) * 700, Math.sin(a) * 700, 0), G.Rz(a), G.S(60, 14, 14)), this.c(th.seam), 0.8);
      }
    }
    // 포털
    const P = GL.Stage.portal;
    if (P) {
      G.draw('ring', G.chain(G.T(P.x, 70, P.y), G.Ry(t * 0.8), G.Rx(Math.PI / 2), G.S(55, 55, 55)), this.c('#d36bff'), 0.9, { spec: 0.8 });
      G.draw('ring', G.chain(G.T(P.x, 70, P.y), G.Ry(-t * 1.3), G.Rx(Math.PI / 2), G.S(42, 42, 42)), this.c('#f0c8ff'), 0.9);
      G.draw('octa', G.chain(G.T(P.x, 70, P.y), G.Ry(t * 2), G.S(16, 22, 16)), this.c('#1a0024'), 0.4, { spec: 1, shine: 60 });
    }
  },

  // 빛 더하기 : 떠다니는 입자, 경계 장벽 빛, 포털 소용돌이
  drawGlow(G, t, obs) {
    const th = this.theme(), b = GL.Stage.bounds;
    G.blend('add');
    const mc = this.c(obs ? '#3fe0a8' : th.mote, 0.7);
    for (const m of this.motes) {
      const h = m.h + Math.sin(t * 0.8 + m.ph) * 20 + ((t * m.sp) % 80);
      G.draw('box', G.chain(G.T(m.x + Math.sin(t * 0.3 + m.ph) * 20, h, m.y), G.Ry(t + m.ph), G.S(m.s, m.s, m.s)), mc, 1);
    }
    // 경계 장벽 : 반투명 빛의 막
    const wa = obs ? [0.25, 0.88, 0.66, 0.08] : [...this.c(th.wall).slice(0, 3), 0.06];
    G.draw('box', G.model(b.x + b.w / 2, 40, b.y, 0, b.w, 70, 1), wa, 1);
    G.draw('box', G.model(b.x + b.w / 2, 40, b.y + b.h, 0, b.w, 70, 1), wa, 1);
    G.draw('box', G.model(b.x, 40, b.y + b.h / 2, 0, 1, 70, b.h), wa, 1);
    G.draw('box', G.model(b.x + b.w, 40, b.y + b.h / 2, 0, 1, 70, b.h), wa, 1);
    const P = GL.Stage.portal;
    if (P) {
      G.decal(G.circle(P.x, P.y, 60), 0.7, [0.8, 0.4, 1, 0.25]);
      for (let i = 0; i < 6; i++) G.decal(G.ringStrip(P.x, P.y, 20 + i * 8, 24 + i * 8, t * (1 + i * 0.2), 2.4, 16), 0.8, [0.83, 0.42, 1, 0.5]);
    }
    G.blend('normal');
  },
};

</script>
<script>
// ===== js/render.js =====
// ============================================================
// render.js — 3인칭 백뷰 카메라 + 그리는 순서만 담당 (v0.5)
// 모델은 모두 js/assets/ 아래 파일에 있음
//   characters.js 아바타 캐릭터 · monsters.js 적/보스 · weapons.js 무기 아티팩트
//   effects.js 이펙트 · background.js 배경
// 3D 장면은 WebGL 캔버스, 글자·체력바는 위쪽 2D 오버레이 캔버스
// ============================================================
GL.Render = {
  yaw: 0, pitch: 0.38, dist: 260, fov: 1.05,
  tgt: { x: 0, y: 0 },

  init(glCanvas, uiCanvas) {
    GL.G3.init(glCanvas, GL.Touch.enabled);   // 휴대폰 : 안티에일리어싱 끄고 저전력
    this.canvas = uiCanvas; this.ctx = uiCanvas.getContext('2d');
    this.props = [];
  },

  // 스테이지가 바뀔 때 배경 배치 (assets/background.js)
  buildProps() { GL.Assets.Background.build(); },

  forward() { return { x: Math.cos(this.yaw), y: Math.sin(this.yaw) }; },

  // 카메라 : 마우스 이동량으로 회전, 플레이어 뒤에서 따라감
  updateCamera(dt) {
    const I = GL.Input, p = GL.Party.player;
    this.yaw += I.mouse.dx * 0.0032;
    this.pitch = GL.U.clamp(this.pitch + I.mouse.dy * 0.0022, 0.1, 0.9);
    I.mouse.dx = 0; I.mouse.dy = 0;
    const k = Math.min(1, dt * 12);
    this.tgt.x += (p.x - this.tgt.x) * k; this.tgt.y += (p.y - this.tgt.y) * k;
  },

  camera() {
    const W = GL.World, f = this.forward();
    const sh = W.shake || 0, jx = (Math.random() - 0.5) * sh, jy = (Math.random() - 0.5) * sh;
    const h = 46 + GL.Party.player.z * 0.3;
    const horiz = this.dist * Math.cos(this.pitch), up = this.dist * Math.sin(this.pitch);
    const target = [this.tgt.x + f.x * 40, h, this.tgt.y + f.y * 40];
    const eye = [this.tgt.x - f.x * horiz + jx, h + up + jy, this.tgt.y - f.y * horiz];
    return { eye, target, fov: this.fov };
  },

  draw() {
    const G = GL.G3, W = GL.World, t = W.time, A = GL.Assets;
    const obs = W.observe.on ? 1 : 0;
    G.frame.mono = W.mono || 0;
    G.begin(this.camera());
    G.resetProgram();

    // 1) 하늘 · 바닥
    A.Background.drawBase(G, t, obs);
    // 2) 불투명 : 배경 구조물 → 캐릭터 → 적 → 이펙트(투사체·파편·아이템)
    A.Background.drawSolid(G, t, obs);
    A.Characters.drawPlayer(G);
    for (const e of W.enemies) if (!e.dead && !(e instanceof GL.Echo)) A.Monsters.draw(G, e);
    A.Effects.solid(G);
    // 3) 반투명 : 바닥 데칼 → 시차 분신(유령) → 빛 더하기
    const gl = G.gl;
    gl.depthMask(false);
    A.Effects.decals(G);
    for (const e of W.enemies) if (!e.dead && e instanceof GL.Echo) A.Monsters.draw(G, e);
    A.Background.drawGlow(G, t, obs);
    A.Effects.glow(G);
    A.Effects.debug(G);
    gl.depthMask(true);

    this.drawOverlay();
  },

  drawOverlay() {
    const ctx = this.ctx, cv = this.canvas, G = GL.G3, W = GL.World, p = GL.Party.player;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const e of W.enemies) {
      if (e.dead || e.boss) continue;
      const top = e instanceof GL.Guardian ? 100 : (e instanceof GL.Echo ? 110 : 66);
      const s = G.project(e.x, top, e.y);
      if (!s) continue;
      const w = Math.max(30, Math.min(90, 3000 / s.d * (e.r / 14))), x = s.x - w / 2, y = s.y;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x, y, w, 7);
      ctx.fillStyle = e.elite ? '#ff9a3d' : '#ff5a6e'; ctx.fillRect(x, y, w * Math.max(0, e.hp / e.maxHp), 4);
      ctx.fillStyle = e.groggy > 0 ? '#ffe066' : '#e8f1ff';
      ctx.fillRect(x, y + 4, w * (e.groggy > 0 ? e.groggy / GL.CONFIG.rules.groggyTime : e.frac / e.fracMax), 3);
      if (e.elite) { ctx.fillStyle = '#ffd7a8'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(e.name, s.x, y - 5); }
    }
    ctx.textAlign = 'center';
    for (const t of W.tele) {
      if (!t.red) continue;
      const s = G.project(t.x + Math.cos(t.dir || 0) * 40, 70, t.y + Math.sin(t.dir || 0) * 40);
      if (s) { ctx.font = 'bold 28px sans-serif'; ctx.fillStyle = '#ff3b5c'; ctx.fillText('!', s.x, s.y); }
    }
    for (const t of W.texts) {
      const s = G.project(t.x, 60, t.y);
      if (!s) continue;
      ctx.globalAlpha = 1 - t.t / 0.9;
      ctx.font = `bold ${t.size + 2}px sans-serif`;
      const yy = s.y - t.t * 46;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.strokeText(t.str, s.x, yy);
      ctx.fillStyle = t.color; ctx.fillText(t.str, s.x, yy);
    }
    ctx.globalAlpha = 1;
    if (W.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${W.flash})`; ctx.fillRect(0, 0, cv.width, cv.height); W.flash -= 0.02; }
    if (p.hurtFlash > 0) { ctx.fillStyle = `rgba(255,40,70,${p.hurtFlash})`; ctx.fillRect(0, 0, cv.width, cv.height); }
    if (W.observe.on) { // 관측 중 화면 가장자리 에메랄드
      const g = ctx.createRadialGradient(cv.width / 2, cv.height / 2, cv.height * 0.35, cv.width / 2, cv.height / 2, cv.height * 0.85);
      g.addColorStop(0, 'rgba(63,224,168,0)'); g.addColorStop(1, 'rgba(63,224,168,0.22)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
    }
  },
};

</script>
<script>
// ===== js/ui.js =====
// ============================================================
// ui.js — HUD : 파티, 스킬, 보스 체력·파쇄 게이지, 지도, 안내, 화면 전환
// ============================================================
GL.UI = {
  bannerText: '', bannerT: 0, mapOpen: false,

  banner(str) { this.bannerText = str; this.bannerT = 3; },

  draw(ctx, cv) {
    const W = GL.World, st = GL.Main.state;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (st === 'title') return this.drawTitle(ctx, cv);
    const touch = GL.Touch.enabled;
    // 안내 배너는 HUD 아래에 깔리도록 먼저 그림
    if (this.bannerT > 0) {
      this.bannerT -= 1 / 60;
      ctx.save(); ctx.globalAlpha = Math.min(1, this.bannerT);
      const fs = touch ? 16 : 22;
      ctx.fillStyle = 'rgba(5,10,20,0.75)'; ctx.fillRect(0, cv.height * 0.28 - fs - 8, cv.width, fs + 30);
      ctx.fillStyle = '#e8f1ff'; ctx.font = `bold ${fs}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText(this.bannerText, cv.width / 2, cv.height * 0.28 + 4); ctx.restore();
    }
    this.drawHint(ctx, cv);
    this.drawParty(ctx, cv);
    if (!touch) this.drawSkills(ctx, cv);
    this.drawBoss(ctx, cv);
    if (!touch) this.drawMinimap(ctx, cv);
    this.drawBuffs(ctx, cv);
    const near = GL.Stage.nearInteractable();
    if (near && !touch) this.pill(ctx, cv.width / 2, cv.height - 170, `[F] ${near}`, '#ffffff');
    if (near && touch) this.pill(ctx, cv.width / 2, cv.height - 40, `F 버튼 : ${near}`, '#ffffff');
    GL.Touch.draw(ctx, cv);
    ctx.fillStyle = 'rgba(200,220,255,0.5)'; ctx.font = '11px sans-serif'; ctx.textAlign = touch ? 'left' : 'right';
    if (touch) ctx.fillText(`프로토타입 ${GL.VERSION}`, 12, cv.height - 8);
    else ctx.fillText(`이클립스 세븐 프로토타입 ${GL.VERSION}  ·  Esc 설정/조작법`, cv.width - 12, cv.height - 10);
    if (this.mapOpen) this.drawBigMap(ctx, cv);
    GL.Master.draw(ctx, cv);
    const again = touch ? '화면을 탭' : 'Enter';
    if (st === 'pause') this.drawPause(ctx, cv);
    if (st === 'over') this.drawEnd(ctx, cv, '전투 불능', '모든 파티원이 쓰러졌습니다', `${again} : 이 구역 다시 도전`);
    if (st === 'win') this.drawEnd(ctx, cv, '토벌 완료', `시간의 찌꺼기 템푸스 처치  ·  클리어 시간 ${GL.Main.clearTime()}`, `${again} : 처음부터 다시`);
  },

  bar(ctx, x, y, w, h, ratio, color, bg = 'rgba(0,0,0,0.55)') {
    ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color; ctx.fillRect(x, y, w * GL.U.clamp(ratio, 0, 1), h);
  },
  pill(ctx, x, y, str, color) {
    ctx.save(); ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    const w = ctx.measureText(str).width + 24;
    ctx.fillStyle = 'rgba(5,10,20,0.8)'; ctx.fillRect(x - w / 2, y - 18, w, 28);
    ctx.strokeStyle = color; ctx.strokeRect(x - w / 2, y - 18, w, 28);
    ctx.fillStyle = color; ctx.fillText(str, x, y + 1); ctx.restore();
  },

  drawParty(ctx, cv) {
    if (GL.Touch.enabled) return this.drawPartyTouch(ctx, cv);
    const P = GL.Party, x0 = 16, y0 = cv.height - 16 - 3 * 64;
    this.partyRects = P.members.map((m, i) => ({ x: x0, y: y0 + i * 64, w: 250, h: 56 }));
    P.members.forEach((m, i) => {
      const y = y0 + i * 64, act = i === P.activeIdx, dead = m.hp <= 0;
      ctx.fillStyle = act ? 'rgba(20,40,70,0.9)' : 'rgba(8,14,26,0.8)'; ctx.fillRect(x0, y, 250, 56);
      ctx.strokeStyle = act ? m.color : 'rgba(120,150,190,0.3)'; ctx.lineWidth = act ? 2 : 1; ctx.strokeRect(x0, y, 250, 56);
      ctx.fillStyle = dead ? '#555' : m.color; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(`${i + 1}  ${m.name}`, x0 + 10, y + 20);
      ctx.fillStyle = '#9fb3c8'; ctx.font = '11px sans-serif'; ctx.fillText(m.cfg.role, x0 + 80, y + 20);
      this.bar(ctx, x0 + 10, y + 28, 230, 8, m.hp / m.maxHp, dead ? '#444' : '#3fe0a8');
      ctx.fillStyle = '#e8f1ff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(`${Math.ceil(m.hp)} / ${m.maxHp}`, x0 + 240, y + 20);
      this.bar(ctx, x0 + 10, y + 40, 150, 5, m.ult / m.ultMax, m.ult >= m.ultMax ? '#ffe066' : '#7aa7ff');
      ctx.textAlign = 'left'; ctx.font = '10px sans-serif';
      if (!act && !dead) {
        ctx.fillStyle = m.cd.assist > 0 ? '#6b7c93' : '#ffe066';
        ctx.fillText(m.cd.assist > 0 ? `조력 ${m.cd.assist.toFixed(0)}초` : `조력 가능 (${i + 1} 홀딩)`, x0 + 168, y + 46);
      } else if (act) { ctx.fillStyle = '#e8f1ff'; ctx.fillText('필드', x0 + 168, y + 46); }
    });
    if (P.tagCd > 0) { ctx.fillStyle = '#9fb3c8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`태그 대기 ${P.tagCd.toFixed(1)}초`, x0, y0 - 8); }
  },

  // 휴대폰 : 왼쪽 위 작은 카드 (탭 = 태그, 0.5초 누르기 = 조력)
  drawPartyTouch(ctx, cv) {
    const P = GL.Party, x0 = 10, w = 168, h = 38, gap = 5;
    const y0 = (this.hintBottom || 60) + 6;
    this.partyRects = [];
    P.members.forEach((m, i) => {
      const y = y0 + i * (h + gap), act = i === P.activeIdx, dead = m.hp <= 0;
      this.partyRects.push({ x: x0, y, w, h });
      const down = GL.Touch.pressed['party' + i];
      ctx.fillStyle = down ? 'rgba(60,90,140,0.85)' : (act ? 'rgba(20,40,70,0.88)' : 'rgba(8,14,26,0.72)');
      ctx.fillRect(x0, y, w, h);
      ctx.strokeStyle = act ? m.color : 'rgba(120,150,190,0.3)'; ctx.lineWidth = act ? 2 : 1; ctx.strokeRect(x0, y, w, h);
      ctx.textAlign = 'left'; ctx.fillStyle = dead ? '#555' : m.color; ctx.font = 'bold 13px sans-serif';
      ctx.fillText(m.name, x0 + 8, y + 15);
      ctx.font = '10px sans-serif';
      if (!act && !dead) { ctx.fillStyle = m.cd.assist > 0 ? '#6b7c93' : '#ffe066'; ctx.fillText(m.cd.assist > 0 ? `조력 ${m.cd.assist.toFixed(0)}` : '조력 (길게)', x0 + 52, y + 15); }
      else if (act) { ctx.fillStyle = '#e8f1ff'; ctx.fillText('필드', x0 + 52, y + 15); }
      ctx.textAlign = 'right'; ctx.fillStyle = '#e8f1ff'; ctx.fillText(`${Math.ceil(m.hp)}`, x0 + w - 6, y + 15);
      this.bar(ctx, x0 + 8, y + 21, w - 16, 6, m.hp / m.maxHp, dead ? '#444' : '#3fe0a8');
      this.bar(ctx, x0 + 8, y + 30, (w - 16) * 0.6, 3, m.ult / m.ultMax, m.ult >= m.ultMax ? '#ffe066' : '#7aa7ff');
    });
    this.partyBottom = y0 + 3 * (h + gap);
  },

  slot(ctx, x, y, key, name, cdLeft, cdMax, ready, color = '#e8f1ff') {
    const s = 58;
    ctx.fillStyle = 'rgba(8,14,26,0.85)'; ctx.fillRect(x, y, s, s);
    ctx.strokeStyle = ready ? color : 'rgba(120,150,190,0.35)'; ctx.lineWidth = 2; ctx.strokeRect(x, y, s, s);
    if (cdLeft > 0 && cdMax > 0) { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x, y + s * (1 - cdLeft / cdMax), s, s * cdLeft / cdMax); }
    ctx.textAlign = 'center';
    ctx.fillStyle = ready ? color : '#6b7c93'; ctx.font = 'bold 18px sans-serif'; ctx.fillText(key, x + s / 2, y + 26);
    ctx.font = '10px sans-serif'; ctx.fillStyle = '#c9d6e6';
    ctx.fillText(name.length > 7 ? name.slice(0, 7) + '…' : name, x + s / 2, y + 46);
    if (cdLeft > 0) { ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px sans-serif'; ctx.fillText(cdLeft.toFixed(1), x + s / 2, y + s + 14); }
  },

  drawSkills(ctx, cv) {
    const ch = GL.Party.active(), p = GL.Party.player, W = GL.World, R = GL.CONFIG.rules;
    if (!ch) return;
    const n = 5, gap = 10, s = 58, total = n * s + (n - 1) * gap;
    let x = cv.width / 2 - total / 2; const y = cv.height - s - 26;
    this.slot(ctx, x, y, 'Q', ch.cfg.q.name, ch.cd.q, ch.cfg.q.cd, ch.cd.q <= 0, ch.color); x += s + gap;
    this.slot(ctx, x, y, 'E', ch.cfg.e.name, ch.cd.e, ch.cfg.e.cd, ch.cd.e <= 0, ch.color); x += s + gap;
    const ultReady = ch.ult >= ch.ultMax;
    this.slot(ctx, x, y, 'R', ch.cfg.r.name, 0, 0, ultReady, '#ffe066');
    ctx.fillStyle = '#7aa7ff'; ctx.fillRect(x, y + s + 4, s * ch.ult / ch.ultMax, 3); x += s + gap;
    const o = W.observe;
    this.slot(ctx, x, y, 'Tab', o.on ? `관측 ${o.t.toFixed(1)}` : '관측', o.cd, R.observeCooldown, !o.on && o.cd <= 0 || o.on, '#3fe0a8');
    if (o.on) { ctx.strokeStyle = '#3fe0a8'; ctx.lineWidth = 3; ctx.strokeRect(x - 3, y - 3, s + 6, s + 6); }
    x += s + gap;
    this.slot(ctx, x, y, 'Shift', `회피 ${p.dodgeCharges}/${R.dodgeCharges}`, p.dodgeCharges === 0 ? p.dodgeRe : 0, R.dodgeRecharge, p.dodgeCharges > 0);
    // 평타 콤보 표시
    if (ch.combo > 0) {
      ctx.textAlign = 'center'; ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = ch.combo === 4 ? '#ffffff' : '#9fb3c8';
      ctx.fillText(`${ch.combo}타 · ${ch.cfg.light[ch.combo - 1].name}`, cv.width / 2, y - 14);
    }
  },

  drawBuffs(ctx, cv) {
    const B = GL.World.buffs, list = [];
    if (B.shield > 0) list.push([`유리 파편 보호막 ${B.shield}`, '#9fe8ff']);
    if (B.fortress > 0) list.push([`수호자의 요새 ${B.fortress.toFixed(1)}초`, '#e0b54a']);
    if (B.barrier > 0) list.push([`절대 경계 ${B.barrier.toFixed(1)}초`, '#e0b54a']);
    if (B.weakAll > 0) list.push([`약점 해독 ${B.weakAll.toFixed(1)}초`, '#b48cff']);
    if (GL.Party.player.slow > 0) list.push(['지연의 늪 : 이동 -50%', '#c49bff']);
    ctx.textAlign = 'left'; ctx.font = 'bold 12px sans-serif';
    if (GL.Touch.enabled) list.forEach(([s, c], i) => { ctx.fillStyle = c; ctx.fillText(s, 12, (this.partyBottom || 200) + 12 + i * 16); });
    else list.forEach(([s, c], i) => { ctx.fillStyle = c; ctx.fillText(s, 280, cv.height - 30 - i * 18); });
  },

  drawBoss(ctx, cv) {
    const b = GL.Boss.current;
    if (!b || b.dead) return;
    const w = Math.max(240, Math.min(560, cv.width - 2 * 390)), x = cv.width / 2 - w / 2, y = 22;
    ctx.textAlign = 'center'; ctx.fillStyle = '#e8d6ff'; ctx.font = 'bold 16px sans-serif';
    ctx.fillText(`${b.title} : ${b.name}   ·   ${b.phase}페이즈`, cv.width / 2, y);
    this.bar(ctx, x, y + 8, w, 14, b.hp / b.maxHp, '#d36bff');
    ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.fillText(`${Math.ceil(b.hp)} / ${b.maxHp}`, cv.width / 2, y + 19);
    // 70% / 50% / 30% 표시
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (const r of [0.7, 0.5, 0.3]) ctx.fillRect(x + w * r - 1, y + 8, 2, 14);
    if (b.groggy > 0) {
      this.bar(ctx, x, y + 26, w, 8, b.groggy / GL.CONFIG.rules.groggyTime, '#ffe066');
      ctx.fillStyle = '#ffe066'; ctx.font = 'bold 13px sans-serif'; ctx.fillText(`그로기 ${b.groggy.toFixed(1)}초 — 받는 피해 +150%`, cv.width / 2, y + 50);
    } else {
      this.bar(ctx, x, y + 26, w, 8, b.frac / b.fracMax, '#e8f1ff');
      ctx.fillStyle = '#c9d6e6'; ctx.font = '11px sans-serif'; ctx.fillText(`파쇄 게이지 ${Math.ceil(b.frac)} / ${b.fracMax}`, cv.width / 2, y + 48);
    }
    if (b.mode === 'recover') { ctx.fillStyle = '#3fe0a8'; ctx.font = 'bold 13px sans-serif'; ctx.fillText('약점 노출 — 시간의 핵 (관측)', cv.width / 2, y + 66); }
    if (b.mode === 'reversal' || b.mode === 'doom') {
      const left = b.mode === 'reversal' ? b.castT : b.doomT;
      ctx.fillStyle = b.mode === 'doom' ? '#ff3b5c' : '#ff9a3d'; ctx.font = 'bold 40px sans-serif';
      ctx.fillText(left.toFixed(1), cv.width / 2, y + 104);
      ctx.font = 'bold 14px sans-serif';
      const cut = GL.Boss.knots.filter(k => k.frac <= 0).length;
      ctx.fillText(`${b.mode === 'doom' ? '시간의 톱니바퀴' : '시간 역류'} — 매듭 ${cut} / ${GL.Boss.knots.length}${GL.World.observe.on ? '' : '   (Tab 관측으로 매듭 확인)'}`, cv.width / 2, y + 126);
    }
  },

  drawHint(ctx, cv) {
    let hint = GL.Stage.hint;
    // 휴대폰에서는 안내 문구의 PC 키 이름을 버튼 이름으로 바꿈
    if (GL.Touch.enabled && hint) {
      for (const [a, b] of [['Tab(관측)', '관측 버튼'], ['(관측)', '(관측 버튼)'], ['강공격(좌클릭 홀딩)', '강공격(공격 길게)'], ['바렌(2) 강공격 홀딩', '바렌 공격 길게'], ['F로', 'F 버튼으로']]) hint = hint.split(a).join(b);
    }
    const lines = [GL.Stage.name === 'field' ? `필드 · 웨이브 ${Math.min(GL.Stage.wave + 1, GL.Stage.WAVES.length)} / ${GL.Stage.WAVES.length}` : '보스전'];
    const touch = GL.Touch.enabled;
    const bw = touch ? Math.min(270, cv.width * 0.32) : 350, lh = touch ? 15 : 18;
    if (hint) { let w = this.wrap(ctx, hint, bw - 20, touch ? 11 : 12); if (touch && w.length > 3) { w = w.slice(0, 3); w[2] += '…'; } lines.push(...w); }
    ctx.fillStyle = 'rgba(8,14,26,0.75)'; ctx.fillRect(touch ? 10 : 12, touch ? 8 : 12, bw, 12 + lines.length * lh);
    ctx.textAlign = 'left';
    lines.forEach((l, i) => { ctx.fillStyle = i === 0 ? '#7aa7ff' : '#c9d6e6'; ctx.font = i === 0 ? `bold ${touch ? 12 : 13}px sans-serif` : `${touch ? 11 : 12}px sans-serif`; ctx.fillText(l, touch ? 18 : 22, (touch ? 23 : 30) + i * lh); });
    this.hintBottom = (touch ? 8 : 12) + 12 + lines.length * lh;
  },

  wrap(ctx, text, maxW, size = 12) {
    ctx.font = `${size}px sans-serif`;
    const out = []; let cur = '';
    for (const ch of text) {
      if (ctx.measureText(cur + ch).width > maxW) { out.push(cur); cur = ch; } else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  },

  drawMinimap(ctx, cv, big) {
    const b = GL.Stage.bounds;
    const mw = big ? Math.min(cv.width * 0.6, 700) : 180;
    const sc = mw / b.w, mh = b.h * sc;
    const x = big ? cv.width / 2 - mw / 2 : cv.width - mw - 14, y = big ? cv.height / 2 - mh / 2 : 14;
    ctx.fillStyle = 'rgba(5,10,20,0.8)'; ctx.fillRect(x, y, mw, mh);
    ctx.strokeStyle = '#5d8fd6'; ctx.lineWidth = 1; ctx.strokeRect(x, y, mw, mh);
    for (const e of GL.World.enemies) {
      if (e.dead) continue;
      ctx.fillStyle = e.boss ? '#d36bff' : (e.elite ? '#ff9a3d' : '#ff5a6e');
      ctx.fillRect(x + e.x * sc - 2, y + e.y * sc - 2, e.boss ? 7 : 4, e.boss ? 7 : 4);
    }
    if (GL.Stage.portal) { ctx.fillStyle = '#d36bff'; ctx.beginPath(); ctx.arc(x + GL.Stage.portal.x * sc, y + GL.Stage.portal.y * sc, 4, 0, 6.283); ctx.fill(); }
    for (const k of GL.World.pickups) { ctx.fillStyle = '#3fe0a8'; ctx.fillRect(x + k.x * sc - 1.5, y + k.y * sc - 1.5, 3, 3); }
    const p = GL.Party.player;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x + p.x * sc, y + p.y * sc, 3, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#9fb3c8'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    if (!big) ctx.fillText('M 지도', x + mw, y + mh + 12);
  },

  drawBigMap(ctx, cv) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, cv.width, cv.height);
    this.drawMinimap(ctx, cv, true);
    ctx.fillStyle = '#e8f1ff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('지도 (M으로 닫기)', cv.width / 2, cv.height / 2 - GL.Stage.bounds.h * Math.min(cv.width * 0.6, 700) / GL.Stage.bounds.w / 2 - 12);
  },

  controlsList() {
    if (GL.Touch.enabled) return [
      ['왼쪽 엄지', '조이스틱 이동 · 원 밖까지 밀면 대쉬'], ['오른쪽 화면 드래그', '카메라 회전'],
      ['공격 탭 / 0.5초 누르기', '평타 1~4타 / 강공격 (바렌 = 퍼펙트 가드)'],
      ['점프 · 공중 공격 · 공중 점프', '점프 / 점프 공격 / 점프 강공격(낙하)'],
      ['회피 · Q · E · R', '회피 / 스킬 1·2 / 궁극기'], ['관측', '약점·매듭·투사체 궤적 보기 (8초)'],
      ['파티 카드 탭 / 길게', '태그 / 대기 파티원 조력 스킬'], ['F · 지도 · Ⅱ', '상호작용 / 지도 / 일시정지'],
      ['세 손가락 탭', '마스터(테스트) 모드 진입·나가기'],
    ];
    return [
      ['마우스 이동', '카메라 회전 (3인칭 백뷰) · 공격은 앞쪽 가까운 적에게 자동 조준'],
      ['WASD', '카메라 기준 이동'], ['Space', '점프'], ['Shift', '회피 (0.3초 무적, 2회)'], ['우클릭 (누르고 있기)', '대쉬 (이동 속도 1.8배)'],
      ['좌클릭', '평타 1~4타 (4타 = 파쇄 속성)'], ['좌클릭 0.5초 홀딩', '강공격 (파쇄 속성) · 바렌 = 퍼펙트 가드'],
      ['공중 좌클릭', '점프 공격'], ['공중 Ctrl + 좌클릭', '점프 강공격 (파쇄 속성)'],
      ['Q / E', '스킬 1 / 2'], ['R', '궁극기 (게이지 가득)'], ['Tab', '관측 : 약점 코어·매듭·투사체 궤적 보기 (8초)'],
      ['1 · 2 · 3 짧게', '파티원 태그'], ['1 · 2 · 3 0.5초 홀딩', '대기 파티원 조력 스킬'],
      ['F', '상호작용 (회복 데이터, 포털)'], ['M', '지도'], ['Esc', '일시정지 / 조작법'],
      ['` / H', '마스터(테스트) 모드 진입·나가기 / 패널'],
    ];
  },

  drawControls(ctx, cx, y, size = 14, lh = 24) {
    ctx.font = `${size}px sans-serif`;
    for (const [k, v] of this.controlsList()) {
      ctx.textAlign = 'right'; ctx.fillStyle = '#ffe066'; ctx.fillText(k, cx - 12, y);
      ctx.textAlign = 'left'; ctx.fillStyle = '#e8f1ff'; ctx.fillText(v, cx + 12, y);
      y += lh;
    }
    return y;
  },

  // 휴대폰 타이틀 (가로 화면 높이 ~360px 기준)
  drawTitleTouch(ctx, cv) {
    const t = performance.now() / 1000, H = cv.height, k = Math.min(1.3, H / 390);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#3fe0a8'; ctx.font = `bold ${11 * k}px sans-serif`; ctx.fillText(`PROJECT GL  ·  프로토타입 ${GL.VERSION}  ·  휴대폰`, cv.width / 2, 26 * k);
    ctx.fillStyle = '#ffffff'; ctx.font = `bold ${34 * k}px sans-serif`; ctx.fillText('이클립스 세븐', cv.width / 2, 64 * k);
    ctx.fillStyle = '#7aa7ff'; ctx.font = `bold ${11 * k}px sans-serif`; ctx.fillText('3D 액션 JRPG  ·  3인칭 백뷰', cv.width / 2, 84 * k);
    const y = this.drawControls(ctx, cv.width / 2 - 20, 112 * k, 12 * k, 22 * k);
    ctx.textAlign = 'center'; ctx.fillStyle = '#c9d6e6'; ctx.font = `${11 * k}px sans-serif`;
    ctx.fillText('파티 : 이안(파쇄) · 바렌(수호/패링) · 케이(극딜)  —  필드 3웨이브 → 인과 보스 템푸스', cv.width / 2, y + 4 * k);
    ctx.fillStyle = Math.sin(t * 4) > 0 ? '#ffffff' : '#7aa7ff'; ctx.font = `bold ${16 * k}px sans-serif`;
    ctx.fillText('화면을 탭해서 시작', cv.width / 2, Math.min(H - 14, y + 30 * k));
  },

  drawTitle(ctx, cv) {
    ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, cv.width, cv.height);
    const t = performance.now() / 1000;
    ctx.strokeStyle = 'rgba(63,224,168,0.12)';
    for (let i = 0; i < 40; i++) { const x = (i * 97 + t * 30) % cv.width; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x - 200, cv.height); ctx.stroke(); }
    if (GL.Touch.enabled) return this.drawTitleTouch(ctx, cv);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#3fe0a8'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(`PROJECT GL  ·  첫 플레이 프로토타입 ${GL.VERSION}`, cv.width / 2, 70);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 52px sans-serif'; ctx.fillText('이클립스 세븐', cv.width / 2, 130);
    ctx.fillStyle = '#7aa7ff'; ctx.font = 'bold 13px sans-serif'; ctx.fillText('3D 액션 JRPG  ·  3인칭 백뷰', cv.width / 2, 188);
    ctx.fillStyle = '#9fb3c8'; ctx.font = '15px sans-serif';
    ctx.fillText('현실은 시스템이 쓴 오답 노트, 반전 세계는 그 위에 덧씌워진 진짜 비극.', cv.width / 2, 162);
    const y = this.drawControls(ctx, cv.width / 2, 220);
    ctx.fillStyle = '#c9d6e6'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('파티 : 1 이안(파쇄)  ·  2 바렌(수호/패링)  ·  3 케이(극딜)   —   필드 3웨이브 → 인과 보스 템푸스', cv.width / 2, y + 14);
    ctx.fillStyle = Math.sin(t * 4) > 0 ? '#ffffff' : '#7aa7ff'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText('클릭해서 시작 (마우스가 화면에 고정됩니다 · Esc로 해제)', cv.width / 2, y + 54);
  },

  drawPause(ctx, cv) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, cv.width, cv.height);
    const touch = GL.Touch.enabled, k = touch ? Math.min(1.3, cv.height / 390) : 1;
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff'; ctx.font = `bold ${touch ? 22 * k : 30}px sans-serif`;
    ctx.fillText('일시정지 · 조작법', cv.width / 2, touch ? 40 * k : 80);
    if (touch) this.drawControls(ctx, cv.width / 2 - 20, 80 * k, 12 * k, 24 * k);
    else this.drawControls(ctx, cv.width / 2, 130);
    ctx.textAlign = 'center'; ctx.fillStyle = '#7aa7ff'; ctx.font = 'bold 16px sans-serif';
    ctx.fillText(touch ? '화면을 탭하면 계속합니다' : '클릭 또는 Esc : 계속하기', cv.width / 2, cv.height - (touch ? 18 : 40));
  },

  drawEnd(ctx, cv, title, sub, action) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff'; ctx.font = `bold ${GL.Touch.enabled ? 34 : 48}px sans-serif`;
    ctx.fillText(title, cv.width / 2, cv.height / 2 - 30);
    ctx.fillStyle = '#c9d6e6'; ctx.font = '16px sans-serif'; ctx.fillText(sub, cv.width / 2, cv.height / 2 + 10);
    ctx.fillStyle = '#7aa7ff'; ctx.font = 'bold 18px sans-serif'; ctx.fillText(action, cv.width / 2, cv.height / 2 + 56);
  },
};

</script>
<script>
// ===== js/main.js =====
// ============================================================
// main.js — 게임 루프, 화면 상태(타이틀/플레이/일시정지/패배/승리), 충돌 정리
// ============================================================
GL.Main = {
  state: 'title',
  startTime: 0, endTime: 0,

  init() {
    const cv = document.getElementById('game'), cv3 = document.getElementById('gl3d');
    this.cv = cv;
    // 화면 크기 : 휴대폰 주소창이 접히거나 화면을 돌릴 때도 다시 맞춤
    const resize = () => {
      const vv = window.visualViewport;
      const w = Math.round(vv ? vv.width : window.innerWidth), h = Math.round(vv ? vv.height : window.innerHeight);
      const dpr = Math.min(window.devicePixelRatio || 1, GL.Touch.enabled ? 1.5 : 2);   // 휴대폰은 발열·속도 위해 1.5배까지
      cv.width = w; cv.height = h;
      cv3.width = Math.floor(w * dpr); cv3.height = Math.floor(h * dpr);
      cv.style.width = cv3.style.width = w + 'px'; cv.style.height = cv3.style.height = h + 'px';
    };
    this.resize = resize;
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 250));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    GL.Touch.init(cv);          // 터치 감지를 먼저 해야 그래픽 설정(저전력)을 고를 수 있음
    resize();
    try { GL.Render.init(cv3, cv); }
    catch (e) { this.fatal = 'WebGL을 켤 수 없는 브라우저입니다: ' + e.message; }
    // 휴대폰에서 앱 전환 등으로 그래픽이 끊기면 탭해서 다시 불러오기
    cv3.addEventListener('webglcontextlost', (e) => { e.preventDefault(); this.fatal = '그래픽이 끊겼습니다. 화면을 탭하면 다시 불러옵니다.'; this.reloadOnTap = true; });
    const reload = () => { if (this.reloadOnTap) location.reload(); };
    cv.addEventListener('touchstart', reload); cv.addEventListener('mousedown', reload);
    // 다른 앱으로 나갔다 오면 일시정지
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.state === 'play') this.state = 'pause'; });
    GL.Input.init(cv);
    GL.Input.isAirborne = () => GL.Party.isAirborne();
    GL.World.reset();
    GL.Party.init();
    this.last = performance.now();
    requestAnimationFrame((t) => this.loop(t));
  },

  newGame() {
    GL.Party.init();
    GL.Stage.start('field');
    this.state = 'play';
    this.startTime = GL.World.time; this.elapsed = 0;
  },

  retryStage() {
    const name = GL.Stage.name;
    for (const m of GL.Party.members) { m.hp = m.maxHp; m.cd = { q: 0, e: 0, assist: 0 }; }
    GL.Party.activeIdx = 0;
    GL.Stage.start(name);
    this.state = 'play';
  },

  gameOver() { if (this.state === 'play') { this.state = 'over'; GL.Input.unlock(); } },
  win() { this.state = 'win'; GL.Input.unlock(); },
  clearTime() { const s = Math.floor(this.elapsed || 0); return `${Math.floor(s / 60)}분 ${s % 60}초`; },

  loop(now) {
    const dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;
    this.update(dt);
    if (this.fatal) {
      const c = this.cv.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0);
      c.fillStyle = '#05070d'; c.fillRect(0, 0, this.cv.width, this.cv.height);
      c.fillStyle = '#fff'; c.font = '16px sans-serif'; c.textAlign = 'center';
      c.fillText(this.fatal, this.cv.width / 2, this.cv.height / 2);
      requestAnimationFrame((t) => this.loop(t)); return;
    }
    // 휴대폰 세로 화면이면 가로로 돌리라는 안내만 표시 (게임은 멈춤)
    if (GL.Touch.enabled && this.cv.height > this.cv.width) { GL.Touch.drawRotate(GL.Render.ctx, this.cv); if (this.state === 'play') this.state = 'pause'; requestAnimationFrame((t) => this.loop(t)); return; }   // v0.4 : 세로 화면에서 루프가 멈추던 버그 수정
    if (this.state !== 'title') GL.Render.draw();
    GL.UI.draw(GL.Render.ctx, this.cv);
    requestAnimationFrame((t) => this.loop(t));
  },

  update(dt) {
    const I = GL.Input;
    I.update(dt);
    const events = I.consume();

    // 화면 상태별 공통 입력
    for (const ev of events) {
      // 마스터 모드 (테스트)
      if (ev.type === 'master') { GL.Master.toggle(); continue; }
      if (ev.type === 'masterPanel') { GL.Master.togglePanel(); continue; }
      if (this.state === 'master') { if (ev.type === 'click') GL.Master.click(I.mouse.x, I.mouse.y); if (ev.type === 'pause') GL.Master.closePanel(); continue; }
      if (this.state === 'title' && (ev.type === 'confirm' || ev.type === 'click')) { this.newGame(); return; }
      if (this.state === 'over' && (ev.type === 'confirm' || ev.type === 'click')) { this.retryStage(); return; }
      if (this.state === 'win' && (ev.type === 'confirm' || ev.type === 'click')) { this.newGame(); return; }
      if (ev.type === 'pause' && (this.state === 'play' || this.state === 'pause')) {
        if (this.state === 'play') { this.state = 'pause'; I.unlock(); } else { this.state = 'play'; }
        return;
      }
      if (this.state === 'pause' && ev.type === 'click') { this.state = 'play'; return; }
      if (ev.type === 'map' && this.state === 'play') GL.UI.mapOpen = !GL.UI.mapOpen;
    }
    GL.Master.update(dt);
    if (this.state !== 'play') return;
    dt *= GL.Master.timeScale();

    for (const ev of events) {
      if (ev.type === 'interact') GL.Stage.interact();
      else GL.Party.handle(ev);
      if (this.state !== 'play') return;
    }

    GL.World.time += dt; this.elapsed = (this.elapsed || 0) + dt;
    GL.Render.updateCamera(dt);
    GL.Party.update(dt);
    if (!GL.Master.frozen()) for (const e of GL.World.enemies) if (!e.dead) e.update(dt);
    this.separate();
    GL.Combat.update(dt);
    GL.Stage.update(dt);
    GL.World.enemies = GL.World.enemies.filter(e => !e.dead);
  },

  // 적끼리, 적과 플레이어가 겹치지 않게 밀어냄
  separate() {
    const list = GL.World.enemies, p = GL.Party.player;
    for (let i = 0; i < list.length; i++) {
      const a = list[i]; if (a.dead) continue;
      for (let j = i + 1; j < list.length; j++) {
        const b = list[j]; if (b.dead) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = a.r + b.r;
        if (d < min) {
          const push = (min - d) / 2, nx = dx / d, ny = dy / d;
          const wa = a.boss ? 0 : 1, wb = b.boss ? 0 : 1;
          a.x -= nx * push * wa * (wb ? 1 : 2); a.y -= ny * push * wa * (wb ? 1 : 2);
          b.x += nx * push * wb * (wa ? 1 : 2); b.y += ny * push * wb * (wa ? 1 : 2);
        }
      }
      if (p.z < 20 && !p.dash) {
        const dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = a.r + p.r;
        if (d < min) { p.x += dx / d * (min - d); p.y += dy / d * (min - d); }
      }
      GL.Stage.clamp(a);
    }
    GL.Stage.clamp(p);
  },
};

window.addEventListener('load', () => GL.Main.init());

</script>
</body>
</html>
